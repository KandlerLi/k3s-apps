# Config from the former Terraform template, byte for byte; SES login from Secrets Manager via monitoring's SecretStore (ADR 0032).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-config
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: aws-secrets-manager
  target:
    name: alertmanager-config
    creationPolicy: Owner
    template:
      data:
        alertmanager.yml: |
          global:
            resolve_timeout: 5m

          route:
            receiver: dual-channel
            group_by: ["alertname"]
            group_wait: 30s
            group_interval: 5m
            repeat_interval: 4h

          receivers:
            - name: dual-channel
              # 192.168.101.1 -- this homeserver's own address on the k3s VM's
              # isolated network, where the ntfy relay's own second listener now
              # runs (see home-infra's monitoring_ntfy_relay_k3s_bind_address).
              # The relay itself stays on the homeserver; only Alertmanager moved.
              webhook_configs:
                - url: http://192.168.101.1:9096/webhook
                  send_resolved: true
              email_configs:
                - to: julian.kandler@outlook.com
                  from: alerts@jkandler.de
                  smarthost: email-smtp.eu-central-1.amazonaws.com:587
                  auth_username: {{ .ses_smtp_username }}
                  auth_password: {{ .ses_smtp_password }}
                  require_tls: true
                  send_resolved: true
  data:
    - secretKey: ses_smtp_username
      remoteRef:
        key: home-infra/monitoring
        property: monitoring_ses_smtp_username
    - secretKey: ses_smtp_password
      remoteRef:
        key: home-infra/monitoring
        property: monitoring_ses_smtp_password
