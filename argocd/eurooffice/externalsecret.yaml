# Values from Secrets Manager's k3s-apps/eurooffice through apps' SecretStore (ADR 0032, 0034).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: eurooffice-env
  namespace: apps
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: aws-secrets-manager
  target:
    name: eurooffice-env
    creationPolicy: Owner
    template:
      data:
        JWT_SECRET: "{{ .jwt_secret }}"
        SECURE_LINK_SECRET: "{{ .secure_link_secret }}"
  data:
    - secretKey: jwt_secret
      remoteRef:
        key: k3s-apps/eurooffice
        property: jwt_secret
    - secretKey: secure_link_secret
      remoteRef:
        key: k3s-apps/eurooffice
        property: secure_link_secret
