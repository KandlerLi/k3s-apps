# From home-infra/authelia and home-infra/monitoring through auth's SecretStore (ADR 0032); templates match what Terraform wrote, byte for byte.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authelia-config
  namespace: auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: aws-secrets-manager
  target:
    name: authelia-config
    creationPolicy: Owner
    template:
      data:
        configuration.yml: |
          server:
            address: 'tcp://0.0.0.0:9091'

          log:
            level: 'info'

          totp:
            issuer: 'jkandler.de'

          identity_validation:
            reset_password:
              jwt_secret: '{{ .authelia_reset_password_jwt_secret }}'

          authentication_backend:
            file:
              path: /config/users_database.yml

          access_control:
            default_policy: deny
            rules:
              - domain: 'auth.jkandler.de'
                policy: bypass
              # Argo CD can deploy: only julian, like its OIDC client.
              - domain: 'argo.jkandler.de'
                policy: two_factor
                subject: 'user:julian'
              # Nextcloud's k3s test instance (ADR 0033): only julian, until the cutover.
              - domain: 'nextcloud-test.jkandler.de'
                policy: two_factor
                subject: 'user:julian'
              - domain:
                  - 'grafana.jkandler.de'
                  - 'home.jkandler.de'
                  - 'k8s.jkandler.de'
                  - 'mail.jkandler.de'
                  - 'stalwart.jkandler.de'
                  - 'vault.jkandler.de'
                policy: two_factor

          # OIDC provider -- lets Grafana, Nextcloud, and Bulwark
          # authenticate against Authelia directly (a real "Sign in with
          # Authelia" button), in addition to the ingress-level forwardAuth
          # gate most of them also sit behind. See history.md ("k3s
          # learning cluster", Authelia SSO entry) for per-client gotchas.
          identity_providers:
            oidc:
              hmac_secret: '{{ .authelia_oidc_hmac_secret }}'
              jwks:
                - key_id: 'main'
                  algorithm: 'RS256'
                  use: 'sig'
                  # A double-quoted, single-physical-line scalar with
                  # escaped \n sequences, not a YAML block scalar -- see
                  # history.md for why a block scalar corrupts this.
                  key: "{{ .authelia_oidc_issuer_private_key | replace "\n" "\\n" }}"
              # Grafana's own role_attribute_path only ever evaluates
              # against the ID Token (grafana/grafana#106686) -- see
              # history.md.
              claims_policies:
                groups_in_id_token:
                  id_token:
                    - 'groups'
                    - 'email'
                    - 'email_verified'
                    - 'preferred_username'
              # Paperless holds personal documents: only julian, not the
              # separate Stalwart "admin" identity, which is also in admins.
              authorization_policies:
                julian_only:
                  default_policy: 'deny'
                  rules:
                    - policy: 'two_factor'
                      subject: 'user:julian'
              clients:
                - client_id: 'grafana'
                  client_name: 'Grafana'
                  client_secret: '{{ .authelia_oidc_grafana_client_secret_hash }}'
                  public: false
                  authorization_policy: 'two_factor'
                  consent_mode: 'pre-configured'
                  pre_configured_consent_duration: '1y'
                  claims_policy: 'groups_in_id_token'
                  require_pkce: true
                  pkce_challenge_method: 'S256'
                  redirect_uris:
                    - 'https://grafana.jkandler.de/login/generic_oauth'
                  scopes:
                    - 'openid'
                    - 'profile'
                    - 'groups'
                    - 'email'
                  response_types:
                    - 'code'
                  grant_types:
                    - 'authorization_code'
                  token_endpoint_auth_method: 'client_secret_basic'
                  # Grafana's own documented claims-hydration limitation --
                  # Authelia's own Grafana integration guide recommends
                  # unsigned (plain JSON) responses specifically for this
                  # client, not a general requirement for every client.
                  access_token_signed_response_alg: 'none'
                  userinfo_signed_response_alg: 'none'
                # Bulwark's own "sign in with Authelia" button -- does NOT
                # by itself change how Bulwark authenticates to Stalwart's
                # JMAP endpoint underneath (see modules/bulwark's own
                # comment). redirect_uris only covers the two locales
                # listed -- add another if a different one 404s.
                - client_id: 'bulwark'
                  client_name: 'Bulwark Webmail'
                  client_secret: '{{ .authelia_oidc_bulwark_client_secret_hash }}'
                  public: false
                  authorization_policy: 'two_factor'
                  consent_mode: 'pre-configured'
                  pre_configured_consent_duration: '1y'
                  claims_policy: 'groups_in_id_token'
                  require_pkce: true
                  pkce_challenge_method: 'S256'
                  redirect_uris:
                    - 'https://mail.jkandler.de/de/auth/callback'
                    - 'https://mail.jkandler.de/en/auth/callback'
                  scopes:
                    - 'openid'
                    - 'profile'
                    - 'groups'
                    - 'email'
                  response_types:
                    - 'code'
                  grant_types:
                    - 'authorization_code'
                  # Bulwark sends the client secret in the POST body, like
                  # Nextcloud below, not the Authorization header
                  # Grafana uses.
                  token_endpoint_auth_method: 'client_secret_post'
                - client_id: 'nextcloud'
                  client_name: 'Nextcloud'
                  client_secret: '{{ .authelia_oidc_nextcloud_client_secret_hash }}'
                  public: false
                  authorization_policy: 'two_factor'
                  consent_mode: 'pre-configured'
                  pre_configured_consent_duration: '1y'
                  claims_policy: 'groups_in_id_token'
                  require_pkce: true
                  pkce_challenge_method: 'S256'
                  redirect_uris:
                    - 'https://nextcloud.jkandler.de/apps/user_oidc/code'
                    # The k3s test instance (ADR 0033), removed at the cutover.
                    - 'https://nextcloud-test.jkandler.de/apps/user_oidc/code'
                  scopes:
                    - 'openid'
                    - 'profile'
                    - 'groups'
                    - 'email'
                  response_types:
                    - 'code'
                  grant_types:
                    - 'authorization_code'
                  token_endpoint_auth_method: 'client_secret_post'
                  access_token_signed_response_alg: 'none'
                  userinfo_signed_response_alg: 'none'
                - client_id: 'paperless'
                  client_name: 'Paperless'
                  client_secret: '{{ .authelia_oidc_paperless_client_secret_hash }}'
                  public: false
                  authorization_policy: 'julian_only'
                  consent_mode: 'pre-configured'
                  pre_configured_consent_duration: '1y'
                  claims_policy: 'groups_in_id_token'
                  require_pkce: true
                  pkce_challenge_method: 'S256'
                  redirect_uris:
                    - 'https://docs.jkandler.de/accounts/oidc/authelia/login/callback/'
                  scopes:
                    - 'openid'
                    - 'profile'
                    - 'groups'
                    - 'email'
                  response_types:
                    - 'code'
                  grant_types:
                    - 'authorization_code'
                  token_endpoint_auth_method: 'client_secret_basic'
                - client_id: 'argocd'
                  client_name: 'Argo CD'
                  client_secret: '{{ .authelia_oidc_argocd_client_secret_hash }}'
                  public: false
                  authorization_policy: 'julian_only'
                  consent_mode: 'pre-configured'
                  pre_configured_consent_duration: '1y'
                  claims_policy: 'groups_in_id_token'
                  require_pkce: true
                  pkce_challenge_method: 'S256'
                  redirect_uris:
                    - 'https://argo.jkandler.de/auth/callback'
                  scopes:
                    - 'openid'
                    - 'profile'
                    - 'groups'
                    - 'email'
                  response_types:
                    - 'code'
                  grant_types:
                    - 'authorization_code'
                  token_endpoint_auth_method: 'client_secret_basic'
                # offline_access: the Bitwarden apps keep their session through refresh tokens.
                - client_id: 'vaultwarden'
                  client_name: 'Vaultwarden'
                  client_secret: '{{ .authelia_oidc_vaultwarden_client_secret_hash }}'
                  public: false
                  authorization_policy: 'julian_only'
                  consent_mode: 'pre-configured'
                  pre_configured_consent_duration: '1y'
                  require_pkce: true
                  pkce_challenge_method: 'S256'
                  redirect_uris:
                    - 'https://vault.jkandler.de/identity/connect/oidc-signin'
                  scopes:
                    - 'openid'
                    - 'offline_access'
                    - 'profile'
                    - 'email'
                  response_types:
                    - 'code'
                  grant_types:
                    - 'authorization_code'
                    - 'refresh_token'
                  access_token_signed_response_alg: 'none'
                  userinfo_signed_response_alg: 'none'
                  token_endpoint_auth_method: 'client_secret_basic'

          session:
            secret: '{{ .authelia_session_secret }}'
            cookies:
              - domain: 'jkandler.de'
                authelia_url: 'https://auth.jkandler.de'
                default_redirection_url: 'https://home.jkandler.de'
            # Without this block Authelia keeps sessions in process memory
            # only, so every Pod restart (each rollout) logged everyone
            # out. Redis is a sidecar in this same Pod (main.tf), so
            # 127.0.0.1 is enough and it is not reachable from other Pods.
            redis:
              host: '127.0.0.1'
              port: 6379

          storage:
            encryption_key: '{{ .authelia_storage_encryption_key }}'
            local:
              path: /data/db.sqlite3

          # SES's own sandbox-mode single-verified-recipient limit (see
          # KandlerLi/ses-relay's own variables.tf) is why startup_check_address
          # and every real recipient this ever sends to has to stay
          # julian.kandler@outlook.com -- the same address
          # modules/alertmanager's own alert_email already uses.
          notifier:
            smtp:
              address: 'submission://email-smtp.eu-central-1.amazonaws.com:587'
              username: '{{ .alertmanager_ses_smtp_username }}'
              password: '{{ .alertmanager_ses_smtp_password }}'
              sender: 'auth@jkandler.de'
              identifier: 'jkandler.de'
              startup_check_address: 'julian.kandler@outlook.com'
  data:
    - secretKey: alertmanager_ses_smtp_password
      remoteRef:
        key: home-infra/monitoring
        property: monitoring_ses_smtp_password
    - secretKey: alertmanager_ses_smtp_username
      remoteRef:
        key: home-infra/monitoring
        property: monitoring_ses_smtp_username
    - secretKey: authelia_oidc_argocd_client_secret_hash
      remoteRef:
        key: home-infra/authelia
        property: authelia_oidc_argocd_client_secret_hash
    - secretKey: authelia_oidc_bulwark_client_secret_hash
      remoteRef:
        key: home-infra/authelia
        property: authelia_oidc_bulwark_client_secret_hash
    - secretKey: authelia_oidc_grafana_client_secret_hash
      remoteRef:
        key: home-infra/authelia
        property: authelia_oidc_grafana_client_secret_hash
    - secretKey: authelia_oidc_hmac_secret
      remoteRef:
        key: home-infra/authelia
        property: authelia_oidc_hmac_secret
    - secretKey: authelia_oidc_issuer_private_key
      remoteRef:
        key: home-infra/authelia
        property: authelia_oidc_issuer_private_key
    - secretKey: authelia_oidc_nextcloud_client_secret_hash
      remoteRef:
        key: home-infra/authelia
        property: authelia_oidc_nextcloud_client_secret_hash
    - secretKey: authelia_oidc_paperless_client_secret_hash
      remoteRef:
        key: home-infra/authelia
        property: authelia_oidc_paperless_client_secret_hash
    - secretKey: authelia_oidc_vaultwarden_client_secret_hash
      remoteRef:
        key: home-infra/authelia
        property: authelia_oidc_vaultwarden_client_secret_hash
    - secretKey: authelia_reset_password_jwt_secret
      remoteRef:
        key: home-infra/authelia
        property: authelia_reset_password_jwt_secret
    - secretKey: authelia_session_secret
      remoteRef:
        key: home-infra/authelia
        property: authelia_session_secret
    - secretKey: authelia_storage_encryption_key
      remoteRef:
        key: home-infra/authelia
        property: authelia_storage_encryption_key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authelia-users
  namespace: auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: aws-secrets-manager
  target:
    name: authelia-users
    creationPolicy: Owner
    template:
      data:
        users_database.yml: |
          users:
            julian:
              disabled: false
              displayname: 'Julian'
              password: '{{ .authelia_admin_password_hash }}'
              email: 'julian.kandler@outlook.com'
              groups:
                - admins
            # Disabled 2026-11-18: never reached Stalwart's /admin, unused since 2026-09-20; Stalwart admin goes via its API key.
            admin:
              disabled: true
              displayname: 'Stalwart Admin'
              password: '{{ .authelia_stalwart_admin_password_hash }}'
              email: 'julian.kandler@outlook.com'
              groups:
                - admins
  data:
    - secretKey: authelia_admin_password_hash
      remoteRef:
        key: home-infra/authelia
        property: authelia_admin_password_hash
    - secretKey: authelia_stalwart_admin_password_hash
      remoteRef:
        key: home-infra/authelia
        property: authelia_stalwart_admin_password_hash
