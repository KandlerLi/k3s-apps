# Authelia, the login portal and forward-auth for every route. Its config and users Secrets, PVCs and checksums: modules/authelia.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authelia
  namespace: auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: authelia
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: authelia
    spec:
      automountServiceAccountToken: false
      containers:
      - image: ghcr.io/authelia/authelia:4.39.28@sha256:bd97cff4fcbf715b5ff1f9ae286afbe6033afce385302520b0368122d43a6f54
        livenessProbe:
          exec:
            command:
            - /app/healthcheck.sh
          failureThreshold: 5
          initialDelaySeconds: 15
          periodSeconds: 30
          timeoutSeconds: 5
        name: authelia
        ports:
        - containerPort: 9091
          name: http
        readinessProbe:
          exec:
            command:
            - /app/healthcheck.sh
          failureThreshold: 5
          initialDelaySeconds: 5
          timeoutSeconds: 5
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 20m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          privileged: false
          readOnlyRootFilesystem: false
          runAsGroup: 65534
          runAsNonRoot: true
          runAsUser: 65534
        volumeMounts:
        - mountPath: /config/configuration.yml
          mountPropagation: None
          name: config
          readOnly: true
          subPath: configuration.yml
        - mountPath: /config/users_database.yml
          mountPropagation: None
          name: users
          readOnly: true
          subPath: users_database.yml
        - mountPath: /data
          mountPropagation: None
          name: data
        - mountPath: /tmp
          mountPropagation: None
          name: tmp
      - args:
        - --bind
        - 127.0.0.1
        - --dir
        - /redis-data
        - --appendonly
        - 'yes'
        - --save
        - ''
        - --maxmemory
        - 48mb
        - --maxmemory-policy
        - noeviction
        image: redis:8-alpine@sha256:71885d8cc6e42f2bc0aa2eb853bfc4be200b5108a46ac50e117ae1df0531fb80
        name: redis
        readinessProbe:
          exec:
            command:
            - redis-cli
            - -h
            - 127.0.0.1
            - ping
          initialDelaySeconds: 3
          timeoutSeconds: 3
        resources:
          limits:
            cpu: 100m
            memory: 96Mi
          requests:
            cpu: 10m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          privileged: false
          readOnlyRootFilesystem: true
          runAsGroup: 65534
          runAsNonRoot: true
          runAsUser: 65534
        volumeMounts:
        - mountPath: /redis-data
          mountPropagation: None
          name: redis-data
      enableServiceLinks: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      shareProcessNamespace: false
      volumes:
      - name: config
        secret:
          optional: false
          secretName: authelia-config
      - name: users
        secret:
          optional: false
          secretName: authelia-users
      - name: data
        persistentVolumeClaim:
          claimName: authelia-data
      - name: redis-data
        persistentVolumeClaim:
          claimName: authelia-redis
      - emptyDir:
          medium: Memory
          sizeLimit: 16Mi
        name: tmp
