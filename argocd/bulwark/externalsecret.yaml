# Values from Secrets Manager's k3s-apps/bulwark, through apps' SecretStore from k3s-bootstrap (ADR 0032).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bulwark-session
  namespace: apps
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: aws-secrets-manager
  target:
    name: bulwark-session
    creationPolicy: Owner
  data:
    - secretKey: SESSION_SECRET
      remoteRef:
        key: k3s-apps/bulwark
        property: bulwark_session_secret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bulwark-oidc
  namespace: apps
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: aws-secrets-manager
  target:
    name: bulwark-oidc
    creationPolicy: Owner
  data:
    - secretKey: OAUTH_CLIENT_SECRET
      remoteRef:
        key: k3s-apps/bulwark
        property: authelia_oidc_bulwark_client_secret
