# Values from Secrets Manager, through apps' SecretStore from k3s-bootstrap (ADR 0032). Each run reads them afresh, so no Reloader.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sankey-export-app-password
  namespace: apps
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: aws-secrets-manager
  target:
    name: sankey-export-app-password
    creationPolicy: Owner
  data:
    - secretKey: app-password
      remoteRef:
        key: k3s-apps/sankey-export
        property: sankey_export_app_password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sankey-export-ghcr-pull-secret
  namespace: apps
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: aws-secrets-manager
  target:
    name: sankey-export-ghcr-pull-secret
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"ghcr.io":{"auth":"{{ printf "KandlerLi:%s" .token | b64enc }}","password":"{{ .token }}","username":"KandlerLi"}}}'
  data:
    - secretKey: token
      remoteRef:
        key: k3s-apps/ghcr-pull-token
        property: token
