apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: apps

resources:
  - deployment.yaml
  - networkpolicy.yaml
  - service.yaml
  - storage.yaml

configMapGenerator:
  - name: minecraft-geyser-patches
    files:
      - files/geyser.json
    options:
      # A fixed name: Argo CD may only write ConfigMaps k3s-bootstrap names.
      disableNameSuffixHash: true
