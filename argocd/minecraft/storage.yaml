# World on k3s-node-3 (minecraft-world; "minecraft" is node-1's old copy until the move is verified), backups on the red HDD; never pruned.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minecraft
  namespace: apps
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: local-path
  volumeName: minecraft-pv
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minecraft-world
  namespace: apps
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: local-path
  volumeName: minecraft-world-pv
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minecraft-backup
  namespace: apps
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 50Gi
  storageClassName: local-path
  volumeName: minecraft-backup-pv
