# World on k3s-node-1's disk, backups on the homeserver's red HDD; bound by name to k3s-bootstrap's PVs, never pruned.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minecraft
  namespace: apps
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: local-path
  volumeName: minecraft-pv
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minecraft-backup
  namespace: apps
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 50Gi
  storageClassName: local-path
  volumeName: minecraft-backup-pv
