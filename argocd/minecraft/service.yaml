# Fixed node ports on k3s-node-3, where home-infra's k3s_ingress_forward DNATs 25565/tcp, 19132/udp and 19132/tcp. Local keeps the client IP. RCON is never exposed.
apiVersion: v1
kind: Service
metadata:
  name: minecraft-svc
  namespace: apps
  annotations:
    # Client-side apply merges ports by number only and drops 19132/tcp next to 19132/udp; server-side keys on port and protocol.
    argocd.argoproj.io/sync-options: ServerSideApply=true
spec:
  externalTrafficPolicy: Local
  ports:
  - name: java
    nodePort: 30565
    port: 25565
    protocol: TCP
    targetPort: 25565
  - name: bedrock
    nodePort: 31932
    port: 19132
    protocol: UDP
    targetPort: 19132
  - name: bedrock-signal
    nodePort: 31933
    port: 19132
    protocol: TCP
    targetPort: 19132
  selector:
    app: minecraft
  # k3s' servicelb doesn't run on the tainted node.
  type: NodePort
