# Java on 25565/tcp; Bedrock (Geyser, NetherNet) signals on 19132/tcp and plays on 19132/udp. Local keeps the client IP. RCON is never exposed.
apiVersion: v1
kind: Service
metadata:
  name: minecraft-svc
  namespace: apps
  annotations:
    # Client-side apply merges ports by number only and drops 19132/tcp next to 19132/udp; server-side keys on port and protocol.
    argocd.argoproj.io/sync-options: ServerSideApply=true
spec:
  externalTrafficPolicy: Local
  healthCheckNodePort: 31565
  ports:
  - name: java
    port: 25565
    protocol: TCP
    targetPort: 25565
  - name: bedrock
    port: 19132
    protocol: UDP
    targetPort: 19132
  - name: bedrock-signal
    port: 19132
    protocol: TCP
    targetPort: 19132
  selector:
    app: minecraft
  type: LoadBalancer
