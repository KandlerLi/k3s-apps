apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: apps

# Being retired: only this ConfigMap is left, so Argo CD can prune the rest (runbook retire-k3s-app).
configMapGenerator:
  - name: nextcloud-tools-source
    files:
      - nextcloud_tools_service.py
    options:
      # Static name: Argo CD may change only named objects, see k3s-bootstrap's argocd.tf.
      disableNameSuffixHash: true
