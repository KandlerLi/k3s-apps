# Values from Secrets Manager, through apps' SecretStore from k3s-bootstrap (ADR 0032).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: home-agent-openai-api-key
  namespace: apps
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: aws-secrets-manager
  target:
    name: home-agent-openai-api-key
    creationPolicy: Owner
  data:
    - secretKey: openai_api_key
      remoteRef:
        key: home-infra/home-agent
        property: home_agent_openai_api_key
