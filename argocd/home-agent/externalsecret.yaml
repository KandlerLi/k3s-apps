---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-pull-secret
  namespace: apps
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: aws-secrets-manager
  target:
    name: ghcr-pull-secret
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"ghcr.io":{"auth":"{{ printf "KandlerLi:%s" .token | b64enc }}","password":"{{ .token }}","username":"KandlerLi"}}}'
  data:
    - secretKey: token
      remoteRef:
        key: k3s-apps/ghcr-pull-token
        property: token
