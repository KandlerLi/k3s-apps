# Only Traefik gets in; out, only cluster DNS and Traefik for Authelia (no icons, push, mail or HIBP lookups).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vaultwarden
  namespace: apps
spec:
  egress:
  - ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
    to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
  - ports:
    - port: 443
      protocol: TCP
    to:
    - podSelector:
        matchLabels:
          app: ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: ingress
    ports:
    - port: 8080
      protocol: TCP
  podSelector:
    matchLabels:
      app: vaultwarden
  policyTypes:
  - Ingress
  - Egress
