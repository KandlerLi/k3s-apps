# Value from Secrets Manager's k3s-apps/vaultwarden, through apps' SecretStore from k3s-bootstrap (ADR 0032).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vaultwarden-sso
  namespace: apps
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: aws-secrets-manager
  target:
    name: vaultwarden-sso
    creationPolicy: Owner
  data:
    - secretKey: SSO_CLIENT_SECRET
      remoteRef:
        key: k3s-apps/vaultwarden
        property: authelia_oidc_vaultwarden_client_secret
