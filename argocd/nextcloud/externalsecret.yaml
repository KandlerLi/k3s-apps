# Values from Secrets Manager's k3s-apps/nextcloud and home-infra/nextcloud (OIDC, shared with AIO until the cutover), through apps' SecretStore (ADR 0032).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nextcloud-postgres
  namespace: apps
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: aws-secrets-manager
  target:
    name: nextcloud-postgres
    creationPolicy: Owner
    template:
      data:
        POSTGRES_USER: nextcloud
        POSTGRES_DB: nextcloud
        POSTGRES_PASSWORD: "{{ .postgres_password }}"
  data:
    - secretKey: postgres_password
      remoteRef:
        key: k3s-apps/nextcloud
        property: nextcloud_postgres_password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nextcloud-env
  namespace: apps
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: aws-secrets-manager
  target:
    name: nextcloud-env
    creationPolicy: Owner
    template:
      data:
        # POSTGRES_PASSWORD for the first install, NC_dbpassword overrides config.php's copy afterwards.
        POSTGRES_PASSWORD: "{{ .postgres_password }}"
        NC_dbpassword: "{{ .postgres_password }}"
        NEXTCLOUD_ADMIN_PASSWORD: "{{ .admin_password }}"
        OIDC_CLIENT_SECRET: "{{ .oidc_client_secret }}"
  data:
    - secretKey: postgres_password
      remoteRef:
        key: k3s-apps/nextcloud
        property: nextcloud_postgres_password
    - secretKey: admin_password
      remoteRef:
        key: k3s-apps/nextcloud
        property: nextcloud_admin_password
    - secretKey: oidc_client_secret
      remoteRef:
        key: home-infra/nextcloud
        property: authelia_oidc_nextcloud_client_secret
