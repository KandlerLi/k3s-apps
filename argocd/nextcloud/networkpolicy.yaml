# In: Traefik to Apache and notify_push, the backup Job to PostgreSQL; nothing else. Out stays open (App Store, Authelia).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nextcloud
  namespace: apps
spec:
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: ingress
    ports:
    - port: 80
      protocol: TCP
    - port: 7867
      protocol: TCP
  - from:
    - podSelector:
        matchLabels:
          app: nextcloud-backup
    ports:
    - port: 5432
      protocol: TCP
  podSelector:
    matchLabels:
      app: nextcloud
  policyTypes:
  - Ingress
