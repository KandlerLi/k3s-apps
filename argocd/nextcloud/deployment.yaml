# Nextcloud (ADR 0033): official Apache image, rootless as www-data (33), PostgreSQL and Redis as native sidecars. Secrets: externalsecret.yaml.
# Until the cutover this is the test instance on nextcloud-test.jkandler.de with an empty data directory.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud
  namespace: apps
  annotations:
    # Reloader (k3s-bootstrap) restarts the Pod when either Secret changes.
    secret.reloader.stakater.com/reload: nextcloud-env,nextcloud-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nextcloud
  # RWO local-path volumes and one code directory: stop the old Pod before starting the new.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: nextcloud
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: NEXTCLOUD_ADMIN_USER
          value: admin
        - name: NEXTCLOUD_DATA_DIR
          value: /mnt/ncdata
        - name: NEXTCLOUD_TRUSTED_DOMAINS
          value: nextcloud-test.jkandler.de
        - name: OVERWRITEHOST
          value: nextcloud-test.jkandler.de
        - name: OVERWRITEPROTOCOL
          value: https
        - name: OVERWRITECLIURL
          value: https://nextcloud-test.jkandler.de
        - name: POSTGRES_DB
          value: nextcloud
        - name: POSTGRES_HOST
          value: 127.0.0.1
        - name: POSTGRES_USER
          value: nextcloud
        # k3s' Pod network, where Traefik connects from, and notify_push in this Pod (localhost resolves to ::1).
        - name: TRUSTED_PROXIES
          value: 10.42.0.0/16 127.0.0.1 ::1
        # App Store apps the hook installs and keeps enabled; the list carried over from AIO (home-infra-tracker#73).
        - name: NEXTCLOUD_APPS
          value: calendar contacts deck notes tasks tables shopping_list guests twofactor_totp twofactor_webauthn files_lock webhook_listeners notify_push
        envFrom:
        - secretRef:
            name: nextcloud-env
            optional: false
        image: nextcloud:35.0.3-apache@sha256:f22d1dd63844bd15bbf6c2019149653c3d1c775ba48b173b56c3c6ad5f386196
        livenessProbe:
          failureThreshold: 5
          periodSeconds: 30
          tcpSocket:
            port: 80
          timeoutSeconds: 5
        name: nextcloud
        ports:
        - containerPort: 80
          name: http
        readinessProbe:
          periodSeconds: 30
          tcpSocket:
            port: 80
          timeoutSeconds: 5
        resources:
          limits:
            cpu: '2'
            memory: 2Gi
          requests:
            cpu: 100m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          privileged: false
          readOnlyRootFilesystem: false
          runAsGroup: 33
          runAsNonRoot: true
          runAsUser: 33
        # Apache only listens once the entrypoint has copied the code and installed or upgraded: up to 20 minutes.
        startupProbe:
          failureThreshold: 120
          periodSeconds: 10
          tcpSocket:
            port: 80
          timeoutSeconds: 3
        volumeMounts:
        - mountPath: /var/www/html
          mountPropagation: None
          name: html
        - mountPath: /mnt/ncdata
          mountPropagation: None
          name: data
        - mountPath: /docker-entrypoint-hooks.d/before-starting
          mountPropagation: None
          name: hooks
          readOnly: true
      # Background jobs every 5 minutes, in the Pod: Redis and PostgreSQL stay on localhost.
      - command:
        - sh
        - -c
        - |
          until php /var/www/html/occ status --output=json 2>/dev/null | grep -q '"installed":true'; do sleep 30; done
          while true; do php -f /var/www/html/cron.php; sleep 300; done
        envFrom:
        - secretRef:
            name: nextcloud-env
            optional: false
        image: nextcloud:35.0.3-apache@sha256:f22d1dd63844bd15bbf6c2019149653c3d1c775ba48b173b56c3c6ad5f386196
        name: cron
        resources:
          limits:
            cpu: '1'
            memory: 1Gi
          requests:
            cpu: 10m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          privileged: false
          readOnlyRootFilesystem: false
          runAsGroup: 33
          runAsNonRoot: true
          runAsUser: 33
        volumeMounts:
        - mountPath: /var/www/html
          mountPropagation: None
          name: html
        - mountPath: /mnt/ncdata
          mountPropagation: None
          name: data
      # notify_push: the binary ships with the app, so it waits until the hook has installed it.
      - command:
        - sh
        - -c
        - |
          bin=/var/www/html/custom_apps/notify_push/bin/x86_64/notify_push
          until [ -f "$bin" ]; do sleep 30; done
          chmod u+x "$bin"
          exec "$bin" /var/www/html/config/config.php
        env:
        - name: PORT
          value: '7867'
        - name: NEXTCLOUD_URL
          value: http://localhost
        - name: REDIS_URL
          value: redis://127.0.0.1
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              key: DATABASE_URL
              name: nextcloud-env
        image: nextcloud:35.0.3-apache@sha256:f22d1dd63844bd15bbf6c2019149653c3d1c775ba48b173b56c3c6ad5f386196
        name: notify-push
        ports:
        - containerPort: 7867
          name: push
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 10m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          privileged: false
          readOnlyRootFilesystem: true
          runAsGroup: 33
          runAsNonRoot: true
          runAsUser: 33
        volumeMounts:
        - mountPath: /var/www/html
          mountPropagation: None
          name: html
      enableServiceLinks: false
      initContainers:
      # All interfaces for the backup CronJob; networkpolicy.yaml lets only that Job in on 5432.
      - args:
        - -c
        - listen_addresses=*
        envFrom:
        - secretRef:
            name: nextcloud-postgres
            optional: false
        image: postgres:18-alpine@sha256:ff64c9e3bdf8e2120107d3559de8db314e8305f7e38c5105903c6295876738ff
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -h
            - 127.0.0.1
            - -U
            - nextcloud
            - -d
            - nextcloud
          failureThreshold: 5
          initialDelaySeconds: 20
          periodSeconds: 30
          timeoutSeconds: 5
        name: postgres
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -h
            - 127.0.0.1
            - -U
            - nextcloud
            - -d
            - nextcloud
          failureThreshold: 5
          initialDelaySeconds: 5
          timeoutSeconds: 5
        resources:
          limits:
            cpu: '1'
            memory: 1Gi
          requests:
            cpu: 20m
            memory: 128Mi
        restartPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          privileged: false
          readOnlyRootFilesystem: false
          runAsGroup: 70
          runAsNonRoot: true
          runAsUser: 70
        # postgres:18 keeps PGDATA in a versioned subdirectory and expects the volume one level up.
        volumeMounts:
        - mountPath: /var/lib/postgresql
          mountPropagation: None
          name: postgres-data
      - args:
        - --bind
        - 127.0.0.1
        - --save
        - ''
        - --appendonly
        - 'no'
        image: redis:8-alpine@sha256:7958cfbb9d152f87dadfbc89f1b0b15938f0b81ff8982feb327476f4911935c3
        name: redis
        readinessProbe:
          exec:
            command:
            - redis-cli
            - -h
            - 127.0.0.1
            - ping
          initialDelaySeconds: 3
          timeoutSeconds: 3
        resources:
          limits:
            cpu: 200m
            memory: 256Mi
          requests:
            cpu: 10m
            memory: 32Mi
        restartPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          privileged: false
          readOnlyRootFilesystem: true
          runAsGroup: 65534
          runAsNonRoot: true
          runAsUser: 65534
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
        # Apache binds port 80 as uid 33 without NET_BIND_SERVICE; a namespaced sysctl that PodSecurity restricted allows.
        sysctls:
        - name: net.ipv4.ip_unprivileged_port_start
          value: '0'
      shareProcessNamespace: false
      volumes:
      - name: html
        persistentVolumeClaim:
          claimName: nextcloud-html
      - name: data
        persistentVolumeClaim:
          claimName: nextcloud-data
      - name: postgres-data
        persistentVolumeClaim:
          claimName: nextcloud-postgres
      - configMap:
          defaultMode: 0555
          name: nextcloud-hooks
        name: hooks
