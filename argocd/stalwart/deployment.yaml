# Stalwart mail server; the web admin stays cluster-internal. Secret, PVCs and checksum: modules/stalwart.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stalwart
  namespace: apps
spec:
  selector:
    matchLabels:
      app: stalwart
  # No replicas field: stalwart-backup scales this to 0 nightly, and self-heal would restart Stalwart mid-backup.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: stalwart
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: STALWART_PUBLIC_URL
          value: https://stalwart.jkandler.de
        - name: SES_SMTP_USERNAME
          valueFrom:
            secretKeyRef:
              key: SES_SMTP_USERNAME
              name: stalwart-ses-smtp
              optional: false
        - name: SES_SMTP_PASSWORD
          valueFrom:
            secretKeyRef:
              key: SES_SMTP_PASSWORD
              name: stalwart-ses-smtp
              optional: false
        image: stalwartlabs/stalwart:v0.16.27@sha256:c429b311c93db5606598abc1c68225a85a6953183848ae01bee9c6a98885836c
        name: stalwart
        ports:
        - containerPort: 25
          name: smtp
        - containerPort: 993
          name: imaps
        - containerPort: 465
          name: submissions
        - containerPort: 8080
          name: http
        resources:
          limits:
            cpu: 500m
            memory: 1Gi
          requests:
            cpu: 50m
            memory: 384Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            # The binary's cap_net_bind_service needs it in the bounding set, for ports 25, 465 and 993.
            add:
            - NET_BIND_SERVICE
            drop:
            - ALL
          privileged: false
          readOnlyRootFilesystem: false
          runAsGroup: 2000
          runAsNonRoot: true
          runAsUser: 2000
        startupProbe:
          failureThreshold: 30
          periodSeconds: 5
          tcpSocket:
            port: 8080
          timeoutSeconds: 3
        volumeMounts:
        - mountPath: /etc/stalwart
          mountPropagation: None
          name: data
          subPath: etc
        - mountPath: /var/lib/stalwart
          mountPropagation: None
          name: data
          subPath: data
      enableServiceLinks: true
      securityContext:
        fsGroup: 2000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      shareProcessNamespace: false
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: stalwart
