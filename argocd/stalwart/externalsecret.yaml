# SES relay login from Secrets Manager's home-infra/monitoring, through apps' SecretStore (ADR 0032).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: stalwart-ses-smtp
  namespace: apps
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: aws-secrets-manager
  target:
    name: stalwart-ses-smtp
    creationPolicy: Owner
  data:
    - secretKey: SES_SMTP_USERNAME
      remoteRef:
        key: home-infra/monitoring
        property: monitoring_ses_smtp_username
    - secretKey: SES_SMTP_PASSWORD
      remoteRef:
        key: home-infra/monitoring
        property: monitoring_ses_smtp_password
