# Nightly RocksDB copy to the red HDD: scales Stalwart to 0 and always back to 1, as k3s-bootstrap's stalwart-backup.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: stalwart-backup
  namespace: apps
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 600
      backoffLimit: 0
      completions: 1
      manualSelector: false
      parallelism: 1
      template:
        metadata:
          labels:
            app: stalwart-backup
        spec:
          automountServiceAccountToken: true
          containers:
          - command:
            - python3
            - -c
            - |
              import glob
              import json
              import os
              import signal
              import ssl
              import sys
              import tarfile
              import time
              import urllib.request

              API = "https://kubernetes.default.svc"
              SA = "/var/run/secrets/kubernetes.io/serviceaccount"
              DEPLOYMENT = "/apis/apps/v1/namespaces/apps/deployments/stalwart/scale"
              # Only live Pods: a node shutdown leaves the old Pod behind as Succeeded/Failed until it's garbage-collected.
              PODS = "/api/v1/namespaces/apps/pods?labelSelector=app%3Dstalwart&fieldSelector=status.phase%21%3DSucceeded%2Cstatus.phase%21%3DFailed"
              DEST_DIR = "/backup"
              RETENTION_DAYS = 14

              # activeDeadlineSeconds sends SIGTERM; exiting through finally still scales Stalwart back up.
              signal.signal(signal.SIGTERM, lambda *_: sys.exit("terminated"))

              with open(f"{SA}/token") as f:
                  token = f.read()
              tls = ssl.create_default_context(cafile=f"{SA}/ca.crt")


              def call(method, path, body=None):
                  request = urllib.request.Request(
                      API + path,
                      method=method,
                      data=json.dumps(body).encode() if body is not None else None,
                      headers={"Authorization": f"Bearer {token}", "Content-Type": "application/merge-patch+json"},
                  )
                  with urllib.request.urlopen(request, context=tls, timeout=30) as response:
                      return json.load(response)


              def scale(replicas):
                  call("PATCH", DEPLOYMENT, {"spec": {"replicas": replicas}})


              date = time.strftime("%Y%m%d-%H%M%S")
              out_path = os.path.join(DEST_DIR, f"stalwart-{date}.tar.gz")
              partial = out_path + ".partial"

              try:
                  scale(0)
                  deadline = time.time() + 180
                  while call("GET", PODS)["items"]:
                      if time.time() > deadline:
                          raise SystemExit("Stalwart's Pod didn't stop within 180 s")
                      time.sleep(2)
                  with tarfile.open(partial, "w:gz") as tar:
                      tar.add("/stalwart", arcname="stalwart")
                  os.replace(partial, out_path)
              finally:
                  if os.path.exists(partial):
                      os.remove(partial)
                  scale(1)

              cutoff = time.time() - RETENTION_DAYS * 86400
              for old in glob.glob(os.path.join(DEST_DIR, "stalwart-*.tar.gz")):
                  if os.path.getmtime(old) < cutoff:
                      os.remove(old)

              print(f"Stalwart backup written: {out_path} ({os.path.getsize(out_path) // 1048576} MiB)")
            image: python:3.15-alpine@sha256:a0f2e268f2ce8f3709611a90054ec6a8ae31f6251f5896b8648b9bb99835e30a
            name: stalwart-backup
            resources:
              limits:
                cpu: 500m
                memory: 256Mi
              requests:
                cpu: 10m
                memory: 32Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
              privileged: false
              readOnlyRootFilesystem: true
              runAsGroup: 977
              runAsNonRoot: true
              runAsUser: 982
            volumeMounts:
            - mountPath: /stalwart
              mountPropagation: None
              name: stalwart-data
              readOnly: true
            - mountPath: /backup
              mountPropagation: None
              name: stalwart-backup
          enableServiceLinks: true
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          serviceAccount: stalwart-backup
          serviceAccountName: stalwart-backup
          shareProcessNamespace: false
          volumes:
          - name: stalwart-data
            persistentVolumeClaim:
              claimName: stalwart
              readOnly: true
          - name: stalwart-backup
            persistentVolumeClaim:
              claimName: stalwart-backup
  schedule: 15 3 * * *
  startingDeadlineSeconds: 300
