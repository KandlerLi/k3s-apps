apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: apps

resources:
  - deployment.yaml
  - services.yaml
  - networkpolicy.yaml
  - storage.yaml

configMapGenerator:
  - name: qbittorrent-config
    files:
      - qBittorrent.conf
    options:
      # Static name: Argo CD may change only named objects, see k3s-bootstrap's argocd.tf.
      disableNameSuffixHash: true
