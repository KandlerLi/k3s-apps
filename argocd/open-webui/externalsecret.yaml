# Value from Secrets Manager's home-infra/open-webui, through apps' SecretStore from k3s-bootstrap (ADR 0032).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: open-webui-oidc-client-secret
  namespace: apps
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: aws-secrets-manager
  target:
    name: open-webui-oidc-client-secret
    creationPolicy: Owner
  data:
    - secretKey: OAUTH_CLIENT_SECRET
      remoteRef:
        key: home-infra/open-webui
        property: authelia_oidc_openwebui_client_secret
