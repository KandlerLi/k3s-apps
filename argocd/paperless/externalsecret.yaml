# Values from Secrets Manager's k3s-apps/paperless, through apps' SecretStore from k3s-bootstrap (ADR 0032).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperless-postgres
  namespace: apps
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: aws-secrets-manager
  target:
    name: paperless-postgres
    creationPolicy: Owner
    template:
      data:
        POSTGRES_USER: paperless
        POSTGRES_DB: paperless
        POSTGRES_PASSWORD: "{{ .postgres_password }}"
  data:
    - secretKey: postgres_password
      remoteRef:
        key: k3s-apps/paperless
        property: paperless_postgres_password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperless-env
  namespace: apps
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: aws-secrets-manager
  target:
    name: paperless-env
    creationPolicy: Owner
    template:
      data:
        PAPERLESS_DBPASS: "{{ .postgres_password }}"
        PAPERLESS_SECRET_KEY: "{{ .secret_key }}"
        # Byte for byte what Terraform's jsonencode wrote, so the move doesn't restart Paperless.
        PAPERLESS_SOCIALACCOUNT_PROVIDERS: '{"openid_connect":{"APPS":[{"client_id":"paperless","name":"Authelia","provider_id":"authelia","secret":{{ .oidc_client_secret | toJson }},"settings":{"server_url":"https://auth.jkandler.de","token_auth_method":"client_secret_basic"}}],"OAUTH_PKCE_ENABLED":true,"SCOPE":["openid","profile","email","groups"]}}'
  data:
    - secretKey: postgres_password
      remoteRef:
        key: k3s-apps/paperless
        property: paperless_postgres_password
    - secretKey: secret_key
      remoteRef:
        key: k3s-apps/paperless
        property: paperless_secret_key
    - secretKey: oidc_client_secret
      remoteRef:
        key: k3s-apps/paperless
        property: authelia_oidc_paperless_client_secret
