# Paperless-ngx (ADR 0023) with PostgreSQL and Redis as native sidecars, rootless as 983:978. Secrets: externalsecret.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless
  namespace: apps
  annotations:
    # Reloader (k3s-bootstrap) restarts the Pod when either Secret changes.
    secret.reloader.stakater.com/reload: paperless-env,paperless-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: paperless
  # RWO local-path volumes: stop the old Pod before starting the new.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: paperless
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: PAPERLESS_APPS
          value: allauth.socialaccount.providers.openid_connect
        - name: PAPERLESS_CONSUMER_ENABLE_BARCODES
          value: 'true'
        - name: PAPERLESS_DBENGINE
          value: postgresql
        - name: PAPERLESS_DBHOST
          value: 127.0.0.1
        - name: PAPERLESS_DBNAME
          value: paperless
        - name: PAPERLESS_DBUSER
          value: paperless
        - name: PAPERLESS_DISABLE_REGULAR_LOGIN
          value: 'true'
        - name: PAPERLESS_OCR_LANGUAGE
          value: deu+eng
        - name: PAPERLESS_REDIRECT_LOGIN_TO_SSO
          value: 'true'
        - name: PAPERLESS_REDIS
          value: redis://127.0.0.1:6379
        - name: PAPERLESS_SOCIAL_ACCOUNT_SYNC_GROUPS
          value: 'true'
        - name: PAPERLESS_SOCIAL_ACCOUNT_SYNC_SUPERUSER_GROUP
          value: admins
        - name: PAPERLESS_SOCIAL_AUTO_SIGNUP
          value: 'true'
        - name: PAPERLESS_TASK_WORKERS
          value: '1'
        - name: PAPERLESS_THREADS_PER_WORKER
          value: '1'
        - name: PAPERLESS_TIME_ZONE
          value: Europe/Berlin
        - name: PAPERLESS_URL
          value: https://docs.jkandler.de
        - name: PAPERLESS_WEBSERVER_WORKERS
          value: '1'
        envFrom:
        - secretRef:
            name: paperless-env
            optional: false
        image: ghcr.io/paperless-ngx/paperless-ngx:3.5.1@sha256:8508853b8a0f8394074260957d0be186c8c64f346973b24a7583de4580f306b9
        livenessProbe:
          failureThreshold: 5
          periodSeconds: 30
          tcpSocket:
            port: 8000
          timeoutSeconds: 5
        name: paperless
        ports:
        - containerPort: 8000
          name: http
        readinessProbe:
          periodSeconds: 30
          tcpSocket:
            port: 8000
          timeoutSeconds: 5
        resources:
          limits:
            cpu: '2'
            memory: 4Gi
          requests:
            cpu: 100m
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          privileged: false
          readOnlyRootFilesystem: false
          runAsGroup: 978
          runAsNonRoot: true
          runAsUser: 983
        startupProbe:
          failureThreshold: 60
          tcpSocket:
            port: 8000
          timeoutSeconds: 3
        volumeMounts:
        - mountPath: /usr/src/paperless/data
          mountPropagation: None
          name: data
        - mountPath: /usr/src/paperless/media
          mountPropagation: None
          name: media
        - mountPath: /usr/src/paperless/consume
          mountPropagation: None
          name: consume
      enableServiceLinks: true
      initContainers:
      # One-shot move to v19 (home-infra-tracker#79): dumps the old cluster until pgdata/ holds the restored v19 one.
      - command:
        - sh
        - -c
        - |
          set -eu
          # /pv is the whole volume; the new cluster lives under pgdata/ (the postgres container's subPath).
          new=/pv/pgdata
          if [ -s "$new/19/docker/PG_VERSION" ]; then
            [ -e "$new/restored" ] && exit 0
            echo "$new holds a v19 cluster without the restored marker: an earlier restore failed, inspect it before removing $new" >&2
            exit 1
          fi
          mkdir -p "$new"
          pg_ctl -D "$OLD_PGDATA" -o "-c listen_addresses='' -c unix_socket_directories=/tmp" -w start
          pg_dump -h /tmp -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Fc -f /initdb/old.dump
          pg_ctl -D "$OLD_PGDATA" -m fast -w stop
          # Sourced by the v19 entrypoint on first init only, while its socket-only temp server runs.
          cat > /initdb/restore.sh <<'EOF'
          if ! pg_restore --exit-on-error --no-owner -U "$POSTGRES_USER" -d "$POSTGRES_DB" /docker-entrypoint-initdb.d/old.dump; then
            # Without PG_VERSION the next start retries initdb on a non-empty directory and fails instead of serving a half-restored DB.
            rm -f "$PGDATA/PG_VERSION"
            exit 1
          fi
          touch /var/lib/postgresql/restored
          EOF
          echo "dumped $(du -h /initdb/old.dump | cut -f1) from $OLD_PGDATA"
        env:
        - name: OLD_PGDATA
          value: /pv
        envFrom:
        - secretRef:
            name: paperless-postgres
            optional: false
        image: postgres:17-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
        name: postgres-upgrade
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 20m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          privileged: false
          readOnlyRootFilesystem: false
          runAsGroup: 70
          runAsNonRoot: true
          runAsUser: 70
        volumeMounts:
        - mountPath: /pv
          name: postgres-data
        - mountPath: /initdb
          name: postgres-upgrade
      - args:
        - -c
        - listen_addresses=0.0.0.0
        envFrom:
        - secretRef:
            name: paperless-postgres
            optional: false
        image: postgres:19-alpine@sha256:cac45fb483caee3668946088a1c0532db89d5285c28dbfeac889b4068296e06f
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - paperless
            - -d
            - paperless
          failureThreshold: 5
          initialDelaySeconds: 20
          periodSeconds: 30
          timeoutSeconds: 5
        name: postgres
        ports:
        - containerPort: 5432
          name: postgres
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - paperless
            - -d
            - paperless
          failureThreshold: 5
          initialDelaySeconds: 5
          timeoutSeconds: 5
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 20m
            memory: 64Mi
        restartPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          privileged: false
          readOnlyRootFilesystem: false
          runAsGroup: 70
          runAsNonRoot: true
          runAsUser: 70
        volumeMounts:
        - mountPath: /var/lib/postgresql
          mountPropagation: None
          name: postgres-data
          subPath: pgdata
        - mountPath: /docker-entrypoint-initdb.d
          name: postgres-upgrade
          readOnly: true
      - args:
        - --bind
        - 127.0.0.1
        - --save
        - ''
        - --appendonly
        - 'no'
        image: redis:8-alpine@sha256:5af80107c1eeecb484a2269b80a26d12bfa6521787da4663bd9f19f60a163483
        name: redis
        readinessProbe:
          exec:
            command:
            - redis-cli
            - -h
            - 127.0.0.1
            - ping
          initialDelaySeconds: 3
          timeoutSeconds: 3
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 32Mi
        restartPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          privileged: false
          readOnlyRootFilesystem: true
          runAsGroup: 65534
          runAsNonRoot: true
          runAsUser: 65534
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      shareProcessNamespace: false
      volumes:
      - emptyDir:
          sizeLimit: 1Gi
        name: postgres-upgrade
      - name: data
        persistentVolumeClaim:
          claimName: paperless-data
      - name: media
        persistentVolumeClaim:
          claimName: paperless-media
      - emptyDir: {}
        name: consume
      - name: postgres-data
        persistentVolumeClaim:
          claimName: paperless-postgres
