# Paperless-ngx (ADR 0023) with PostgreSQL and Redis as native sidecars, rootless as 983:978. Secrets, PVCs, checksums: modules/paperless.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: paperless
  # RWO local-path volumes: stop the old Pod before starting the new.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: paperless
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: PAPERLESS_APPS
          value: allauth.socialaccount.providers.openid_connect
        - name: PAPERLESS_CONSUMER_ENABLE_BARCODES
          value: 'true'
        - name: PAPERLESS_DBENGINE
          value: postgresql
        - name: PAPERLESS_DBHOST
          value: 127.0.0.1
        - name: PAPERLESS_DBNAME
          value: paperless
        - name: PAPERLESS_DBUSER
          value: paperless
        - name: PAPERLESS_DISABLE_REGULAR_LOGIN
          value: 'true'
        - name: PAPERLESS_OCR_LANGUAGE
          value: deu+eng
        - name: PAPERLESS_REDIRECT_LOGIN_TO_SSO
          value: 'true'
        - name: PAPERLESS_REDIS
          value: redis://127.0.0.1:6379
        - name: PAPERLESS_SOCIAL_ACCOUNT_SYNC_GROUPS
          value: 'true'
        - name: PAPERLESS_SOCIAL_ACCOUNT_SYNC_SUPERUSER_GROUP
          value: admins
        - name: PAPERLESS_SOCIAL_AUTO_SIGNUP
          value: 'true'
        - name: PAPERLESS_TASK_WORKERS
          value: '1'
        - name: PAPERLESS_THREADS_PER_WORKER
          value: '1'
        - name: PAPERLESS_TIME_ZONE
          value: Europe/Berlin
        - name: PAPERLESS_URL
          value: https://docs.jkandler.de
        - name: PAPERLESS_WEBSERVER_WORKERS
          value: '1'
        envFrom:
        - secretRef:
            name: paperless-env
            optional: false
        image: ghcr.io/paperless-ngx/paperless-ngx:3.4.2@sha256:d704e84f88300eb6ab001ab15720a2330ff99169cf9f94d6b8fcc44b63a84c84
        livenessProbe:
          failureThreshold: 5
          periodSeconds: 30
          tcpSocket:
            port: 8000
          timeoutSeconds: 5
        name: paperless
        ports:
        - containerPort: 8000
          name: http
        readinessProbe:
          periodSeconds: 30
          tcpSocket:
            port: 8000
          timeoutSeconds: 5
        resources:
          limits:
            cpu: '2'
            memory: 4Gi
          requests:
            cpu: 100m
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          privileged: false
          readOnlyRootFilesystem: false
          runAsGroup: 978
          runAsNonRoot: true
          runAsUser: 983
        startupProbe:
          failureThreshold: 60
          tcpSocket:
            port: 8000
          timeoutSeconds: 3
        volumeMounts:
        - mountPath: /usr/src/paperless/data
          mountPropagation: None
          name: data
        - mountPath: /usr/src/paperless/media
          mountPropagation: None
          name: media
        - mountPath: /usr/src/paperless/consume
          mountPropagation: None
          name: consume
      enableServiceLinks: true
      initContainers:
      - args:
        - -c
        - listen_addresses=0.0.0.0
        envFrom:
        - secretRef:
            name: paperless-postgres
            optional: false
        image: postgres:17-alpine@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - paperless
            - -d
            - paperless
          failureThreshold: 5
          initialDelaySeconds: 20
          periodSeconds: 30
          timeoutSeconds: 5
        name: postgres
        ports:
        - containerPort: 5432
          name: postgres
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - paperless
            - -d
            - paperless
          failureThreshold: 5
          initialDelaySeconds: 5
          timeoutSeconds: 5
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 20m
            memory: 64Mi
        restartPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          privileged: false
          readOnlyRootFilesystem: false
          runAsGroup: 70
          runAsNonRoot: true
          runAsUser: 70
        volumeMounts:
        - mountPath: /var/lib/postgresql/data
          mountPropagation: None
          name: postgres-data
      - args:
        - --bind
        - 127.0.0.1
        - --save
        - ''
        - --appendonly
        - 'no'
        image: redis:8-alpine@sha256:71885d8cc6e42f2bc0aa2eb853bfc4be200b5108a46ac50e117ae1df0531fb80
        name: redis
        readinessProbe:
          exec:
            command:
            - redis-cli
            - -h
            - 127.0.0.1
            - ping
          initialDelaySeconds: 3
          timeoutSeconds: 3
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 32Mi
        restartPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          privileged: false
          readOnlyRootFilesystem: true
          runAsGroup: 65534
          runAsNonRoot: true
          runAsUser: 65534
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      shareProcessNamespace: false
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: paperless-data
      - name: media
        persistentVolumeClaim:
          claimName: paperless-media
      - emptyDir: {}
        name: consume
      - name: postgres-data
        persistentVolumeClaim:
          claimName: paperless-postgres
