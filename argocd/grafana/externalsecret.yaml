# Values from Secrets Manager, through monitoring's SecretStore from k3s-bootstrap (ADR 0032).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin-password
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: aws-secrets-manager
  target:
    name: grafana-admin-password
    creationPolicy: Owner
  data:
    - secretKey: grafana_admin_password
      remoteRef:
        key: home-infra/grafana
        property: grafana_admin_password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-oidc-client-secret
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: aws-secrets-manager
  target:
    name: grafana-oidc-client-secret
    creationPolicy: Owner
    template:
      data:
        grafana.ini: |
          [auth.generic_oauth]
          client_secret = {{ .client_secret }}
  data:
    - secretKey: client_secret
      remoteRef:
        key: home-infra/grafana
        property: authelia_oidc_grafana_client_secret
---
# Grafana's provisioned datasources; Reloader restarts Grafana when the rendered Secret changes.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-datasources
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: aws-secrets-manager
  target:
    name: grafana-datasources
    creationPolicy: Owner
    template:
      data:
        datasources.yaml: |
          apiVersion: 1

          datasources:
            - name: Prometheus
              uid: prometheus
              type: prometheus
              access: proxy
              url: http://192.168.101.1:9090
              isDefault: true
              editable: false
            - name: blocky-postgresql
              uid: blocky-postgres
              type: postgres
              access: proxy
              url: blocky-svc.apps.svc.cluster.local:5432
              user: blocky
              # database belongs in jsonData, not as a top-level field -- same
              # fix home-infra's own grafana_datasources.yml.j2 already needed
              # (confirmed live 2026-08-28 against Grafana's current provisioning
              # docs).
              jsonData:
                database: blocky_query_log
                sslmode: disable
                postgresVersion: 1700
              secureJsonData:
                password: {{ .blocky_postgres_password }}
              editable: false
            # The homeserver's Loki (home-infra's monitoring role): host journal and Pod logs.
            - name: Loki
              uid: loki
              type: loki
              access: proxy
              url: http://192.168.101.1:3100
              editable: false
  data:
    - secretKey: blocky_postgres_password
      remoteRef:
        key: home-infra/blocky
        property: blocky_postgres_password
