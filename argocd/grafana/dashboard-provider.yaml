# Provisioned from files: no deletion, no editing in the UI.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: monitoring
data:
  dashboards.yml: |
    apiVersion: 1

    providers:
      - name: monitoring
        orgId: 1
        folder: ""
        type: file
        disableDeletion: true
        editable: false
        updateIntervalSeconds: 60
        options:
          path: /var/lib/grafana-dashboards
