apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

resources:
  - dashboard-provider.yaml
  - deployment.yaml
  - externalsecret.yaml
  - service.yaml

configMapGenerator:
  # The dashboards live here; tags and the top link bar tie them together (tag homeserver).
  - name: grafana-dashboards
    files:
      # Generated and normalised by scripts/grafana-dashboards.py; home-infra's files/dashboards copies are stale (tracker #76).
      - dashboards/overview.json
      - dashboards/node-resources.json
      - dashboards/k8s-workloads.json
      - dashboards/service-reachability.json
      - dashboards/backups.json
      - dashboards/blocky.json
      - dashboards/blocky-postgres.json
      - dashboards/github-runners.json
    options:
      # Static name: Argo CD may change only named objects, see k3s-bootstrap's argocd.tf.
      disableNameSuffixHash: true
      # Server-side apply: client-side apply copies every dashboard into last-applied-configuration, which caps at 256 KiB.
      annotations:
        argocd.argoproj.io/sync-options: ServerSideApply=true
