apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

resources:
  - deployment.yaml

configMapGenerator:
  - name: alloy-config
    files:
      - config.alloy
    options:
      # Static name: Argo CD may change only named objects, see k3s-bootstrap's argocd.tf.
      disableNameSuffixHash: true
