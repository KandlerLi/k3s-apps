# Ships Pod logs to the homeserver's Loki (home-infra's monitoring role); its RBAC lives in k3s-bootstrap.
# Reloader ignores ConfigMaps: after a config.alloy change, kubectl -n monitoring rollout restart deployment alloy.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alloy
  namespace: monitoring
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: alloy
  template:
    metadata:
      labels:
        app: alloy
    spec:
      serviceAccountName: alloy
      automountServiceAccountToken: true
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: alloy
        image: grafana/alloy:v1.22.0@sha256:9acc2529bc1edb7f5b2bd801dd8334ebc80c158e3a9e5526ecd7c9a273d43189
        args:
        - run
        # Loopback only: nothing in the cluster needs its UI.
        - --server.http.listen-addr=127.0.0.1:12345
        - --storage.path=/alloy-data
        - --disable-reporting
        - /etc/alloy/config.alloy
        resources:
          limits:
            cpu: 200m
            memory: 256Mi
          requests:
            cpu: 20m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          privileged: false
          readOnlyRootFilesystem: true
          runAsGroup: 65534
          runAsNonRoot: true
          runAsUser: 65534
        volumeMounts:
        - name: config
          mountPath: /etc/alloy
          readOnly: true
        - name: data
          mountPath: /alloy-data
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: config
        configMap:
          name: alloy-config
      - name: data
        emptyDir:
          sizeLimit: 256Mi
      - name: tmp
        emptyDir:
          sizeLimit: 32Mi
