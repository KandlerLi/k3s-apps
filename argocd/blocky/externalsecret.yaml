# All three from home-infra/blocky's password, through apps' SecretStore (ADR 0032); templates match what Terraform wrote, byte for byte.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: blocky-config
  namespace: apps
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: aws-secrets-manager
  target:
    name: blocky-config
    creationPolicy: Owner
    template:
      data:
        config.yml: |
          upstreams:
            groups:
              default:
                - 1.1.1.1
                - 9.9.9.9

          bootstrapDns:
            - upstream: 1.1.1.1
            - upstream: 9.9.9.9

          ports:
            dns: 0.0.0.0:53
            http: 0.0.0.0:4000

          prometheus:
            enable: true
            path: /metrics

          blocking:
            denylists:
              ads:
                - https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts
            clientGroupsBlock:
              default:
                - ads

          queryLog:
            type: postgresql
            target: postgres://blocky:{{ .password }}@127.0.0.1:5432/blocky_query_log?sslmode=disable
            logRetentionDays: 7
            flushInterval: 30s
  data:
    - secretKey: password
      remoteRef:
        key: home-infra/blocky
        property: blocky_postgres_password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: blocky-postgres-credentials
  namespace: apps
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: aws-secrets-manager
  target:
    name: blocky-postgres-credentials
    creationPolicy: Owner
    template:
      data:
        POSTGRES_USER: blocky
        POSTGRES_PASSWORD: "{{ .password }}"
        POSTGRES_DB: blocky_query_log
  data:
    - secretKey: password
      remoteRef:
        key: home-infra/blocky
        property: blocky_postgres_password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: blocky-postgres-exporter-dsn
  namespace: apps
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: aws-secrets-manager
  target:
    name: blocky-postgres-exporter-dsn
    creationPolicy: Owner
    template:
      data:
        DATA_SOURCE_NAME: "postgresql://blocky:{{ .password }}@127.0.0.1:5432/blocky_query_log?sslmode=disable"
  data:
    - secretKey: password
      remoteRef:
        key: home-infra/blocky
        property: blocky_postgres_password
