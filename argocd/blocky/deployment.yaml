# Blocky, the LAN's DNS with ad blocking, and Postgres in one Pod: the query log connects via 127.0.0.1. Secrets: externalsecret.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blocky
  namespace: apps
  annotations:
    # Reloader (k3s-bootstrap) restarts the Pod when one of these changes.
    secret.reloader.stakater.com/reload: blocky-config,blocky-postgres-credentials,blocky-postgres-exporter-dsn
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blocky
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: blocky
    spec:
      automountServiceAccountToken: false
      containers:
      - image: ghcr.io/0xerr0r/blocky:v0.37.0@sha256:d9b6344d7c8f3fe577a47bc97b523faa116f7ea8a8901bfaf800a4dbdce64c96
        livenessProbe:
          exec:
            command:
            - /app/blocky
            - healthcheck
          failureThreshold: 5
          initialDelaySeconds: 15
          periodSeconds: 30
          timeoutSeconds: 5
        name: blocky
        ports:
        - containerPort: 53
          name: dns-tcp
        - containerPort: 53
          name: dns-udp
          protocol: UDP
        - containerPort: 4000
          name: http
        readinessProbe:
          exec:
            command:
            - /app/blocky
            - healthcheck
          failureThreshold: 5
          initialDelaySeconds: 5
          timeoutSeconds: 5
        resources:
          limits:
            cpu: '1'
            memory: 256Mi
          requests:
            cpu: 20m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            add:
            - NET_BIND_SERVICE
            drop:
            - ALL
          privileged: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 100
        volumeMounts:
        - mountPath: /app/config.yml
          mountPropagation: None
          name: config
          readOnly: true
          subPath: config.yml
        - mountPath: /tmp
          mountPropagation: None
          name: tmp
      - envFrom:
        - secretRef:
            name: blocky-postgres-exporter-dsn
            optional: false
        image: quay.io/prometheuscommunity/postgres-exporter:v0.21.1@sha256:a88794758ad461c75f3825b51cde4bde730bdff04b3b24d00efe14217e41f615
        livenessProbe:
          failureThreshold: 5
          httpGet:
            path: /metrics
            port: 9187
          initialDelaySeconds: 20
          periodSeconds: 30
          timeoutSeconds: 5
        name: postgres-exporter
        ports:
        - containerPort: 9187
          name: metrics
        readinessProbe:
          failureThreshold: 5
          httpGet:
            path: /metrics
            port: 9187
          initialDelaySeconds: 10
          periodSeconds: 15
          timeoutSeconds: 5
        resources:
          limits:
            cpu: 100m
            memory: 64Mi
          requests:
            cpu: 10m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          privileged: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65534
      enableServiceLinks: true
      initContainers:
      # One-shot move to v19 (home-infra-tracker#79): dumps the old cluster until pgdata/ holds the restored v19 one.
      - command:
        - sh
        - -c
        - |
          set -eu
          # /pv is the whole volume; the new cluster lives under pgdata/ (the postgres container's subPath).
          new=/pv/pgdata
          if [ -s "$new/19/docker/PG_VERSION" ]; then
            [ -e "$new/restored" ] && exit 0
            echo "$new holds a v19 cluster without the restored marker: an earlier restore failed, inspect it before removing $new" >&2
            exit 1
          fi
          mkdir -p "$new"
          pg_ctl -D "$OLD_PGDATA" -o "-c listen_addresses='' -c unix_socket_directories=/tmp" -w start
          pg_dump -h /tmp -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Fc -f /initdb/old.dump
          pg_ctl -D "$OLD_PGDATA" -m fast -w stop
          # Sourced by the v19 entrypoint on first init only, while its socket-only temp server runs.
          cat > /initdb/restore.sh <<'EOF'
          if ! pg_restore --exit-on-error --no-owner -U "$POSTGRES_USER" -d "$POSTGRES_DB" /docker-entrypoint-initdb.d/old.dump; then
            # Without PG_VERSION the next start retries initdb on a non-empty directory and fails instead of serving a half-restored DB.
            rm -f "$PGDATA/PG_VERSION"
            exit 1
          fi
          touch /var/lib/postgresql/restored
          EOF
          echo "dumped $(du -h /initdb/old.dump | cut -f1) from $OLD_PGDATA"
        env:
        - name: OLD_PGDATA
          value: /pv
        envFrom:
        - secretRef:
            name: blocky-postgres-credentials
            optional: false
        image: postgres:17-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
        name: postgres-upgrade
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 20m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          privileged: false
          readOnlyRootFilesystem: false
          runAsGroup: 70
          runAsNonRoot: true
          runAsUser: 70
        volumeMounts:
        - mountPath: /pv
          name: postgres-data
        - mountPath: /initdb
          name: postgres-upgrade
      - args:
        - -c
        - listen_addresses=0.0.0.0
        envFrom:
        - secretRef:
            name: blocky-postgres-credentials
            optional: false
        image: postgres:19-alpine@sha256:cac45fb483caee3668946088a1c0532db89d5285c28dbfeac889b4068296e06f
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - blocky
            - -d
            - blocky_query_log
          failureThreshold: 5
          initialDelaySeconds: 20
          periodSeconds: 30
          timeoutSeconds: 5
        name: postgres
        ports:
        - containerPort: 5432
          name: postgres
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - blocky
            - -d
            - blocky_query_log
          failureThreshold: 5
          initialDelaySeconds: 10
          timeoutSeconds: 5
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 20m
            memory: 64Mi
        restartPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          privileged: false
          readOnlyRootFilesystem: false
          runAsGroup: 70
          runAsNonRoot: true
          runAsUser: 70
        volumeMounts:
        - mountPath: /var/lib/postgresql
          mountPropagation: None
          name: postgres-data
          subPath: pgdata
        - mountPath: /docker-entrypoint-initdb.d
          name: postgres-upgrade
          readOnly: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      shareProcessNamespace: false
      volumes:
      - emptyDir:
          sizeLimit: 1Gi
        name: postgres-upgrade
      - name: config
        secret:
          optional: false
          secretName: blocky-config
      - emptyDir:
          medium: Memory
          sizeLimit: 16Mi
        name: tmp
      - name: postgres-data
        persistentVolumeClaim:
          claimName: blocky-postgres
