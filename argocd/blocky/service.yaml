apiVersion: v1
kind: Service
metadata:
  name: blocky-svc
  namespace: apps
spec:
  externalTrafficPolicy: Local
  healthCheckNodePort: 32110
  ports:
  - name: dns-tcp
    port: 53
    targetPort: 53
  - name: dns-udp
    port: 53
    protocol: UDP
    targetPort: 53
  - name: http
    port: 4000
    targetPort: 4000
  - name: postgres
    port: 5432
    targetPort: 5432
  - name: postgres-exporter
    port: 9187
    targetPort: 9187
  selector:
    app: blocky
  type: LoadBalancer
