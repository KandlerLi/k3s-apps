# Route 53 key for ACME DNS-01 from Secrets Manager's home-infra/ingress, through apps' SecretStore (ADR 0032).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ingress-acme-dns01-credentials
  namespace: apps
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: aws-secrets-manager
  target:
    name: ingress-acme-dns01-credentials
    creationPolicy: Owner
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: home-infra/ingress
        property: k3s_ingress_acme_dns01_access_key_id
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: home-infra/ingress
        property: k3s_ingress_acme_dns01_secret_access_key
