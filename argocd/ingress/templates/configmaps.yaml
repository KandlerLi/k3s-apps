apiVersion: v1
kind: ConfigMap
metadata:
  name: ingress-static-config
  namespace: apps
data:
  traefik.yml: {{ .Files.Get "files/traefik.yml" | toJson }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ingress-dynamic-config
  namespace: apps
data:
  routes.yml: {{ include "ingress.routes" . | toJson }}
