# Nextcloud AIO's Apache on the homeserver, reached over the k3s VM network (192.168.101.1:11000).
apiVersion: v1
kind: Service
metadata:
  name: nextcloud-aio-backend
  namespace: apps
spec:
  ports:
  - port: 11000
    targetPort: 11000
---
apiVersion: v1
kind: Endpoints
metadata:
  name: nextcloud-aio-backend
  namespace: apps
subsets:
- addresses:
  - ip: 192.168.101.1
  ports:
  - port: 11000
    protocol: TCP
