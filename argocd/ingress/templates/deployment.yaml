# Traefik, the only HTTP(S) entry into k3s; file provider only, ACME via DNS-01 (Secret: modules/ingress).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingress
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ingress
  template:
    metadata:
      annotations:
        # Traefik reads its static config only at start; the dynamic one it watches. The ACME Secret's checksum: modules/ingress.
        checksum/static-config: {{ .Files.Get "files/traefik.yml" | sha256sum }}
      labels:
        app: ingress
    spec:
      automountServiceAccountToken: false
      containers:
      - args:
        - --configFile=/etc/traefik/traefik.yml
        env:
        - name: AWS_HOSTED_ZONE_ID
          value: Z07879811I86VC8PAL8HX
        - name: AWS_REGION
          value: eu-central-1
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              key: AWS_ACCESS_KEY_ID
              name: ingress-acme-dns01-credentials
              optional: false
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              key: AWS_SECRET_ACCESS_KEY
              name: ingress-acme-dns01-credentials
              optional: false
        image: traefik:v3.7.17@sha256:f4bb143d1135a579b630ed491e17ec50f6f7c9c6a30585ff3d385471d2a86f5a
        livenessProbe:
          httpGet:
            path: /ping
            port: 8082
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
        name: traefik
        ports:
        - containerPort: 80
          name: web
        - containerPort: 443
          name: websecure
        - containerPort: 8082
          name: health
        readinessProbe:
          httpGet:
            path: /ping
            port: 8082
          initialDelaySeconds: 5
          timeoutSeconds: 5
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 20m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            add:
            - NET_BIND_SERVICE
            drop:
            - ALL
          privileged: false
          readOnlyRootFilesystem: true
          runAsGroup: 65534
          runAsNonRoot: true
          runAsUser: 65534
        volumeMounts:
        - mountPath: /etc/traefik/traefik.yml
          mountPropagation: None
          name: static-config
          readOnly: true
          subPath: traefik.yml
        - mountPath: /etc/traefik/dynamic/routes.yml
          mountPropagation: None
          name: dynamic-config
          readOnly: true
          subPath: routes.yml
        - mountPath: /letsencrypt
          mountPropagation: None
          name: acme
        - mountPath: /tmp
          mountPropagation: None
          name: tmp
      enableServiceLinks: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      shareProcessNamespace: false
      volumes:
      - configMap:
          name: ingress-static-config
          optional: false
        name: static-config
      - configMap:
          name: ingress-dynamic-config
          optional: false
        name: dynamic-config
      - name: acme
        persistentVolumeClaim:
          claimName: ingress-acme
      - emptyDir:
          medium: Memory
          sizeLimit: 16Mi
        name: tmp
