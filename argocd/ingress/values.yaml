# One Traefik router per entry (name = router, service and middleware prefix). url is the in-cluster backend;
# forward_auth puts Authelia in front, and a route with false is a reviewed exception. rate_limit and
# max_body_bytes add those middlewares; referrer_policy defaults to no-referrer, frame_deny to true;
# strip_prefix removes a path prefix before the backend sees it.
routes:
  # Argo CD's UI (k3s-bootstrap); it also logs in through Authelia's OIDC.
  argo:
    rule: Host(`argo.jkandler.de`)
    url: http://argocd-server.argocd.svc.cluster.local:80
    forward_auth: true
    rate_limit:
      average: 120
      burst: 240
    max_body_bytes: 1048576
  # No forward-auth: this is the login portal, bypassed in Authelia's access_control.
  auth:
    rule: Host(`auth.jkandler.de`)
    url: http://authelia-svc.auth.svc.cluster.local:9091
    forward_auth: false
  # No forward-auth: the mobile app uses API tokens. /admin is left unrouted.
  docs:
    rule: Host(`docs.jkandler.de`) && !PathPrefix(`/admin`)
    url: http://paperless-svc:80
    forward_auth: false
    rate_limit:
      average: 120
      burst: 240
    max_body_bytes: 104857600
    referrer_policy: same-origin
  grafana:
    rule: Host(`grafana.jkandler.de`)
    url: http://grafana-svc.monitoring.svc.cluster.local:80
    forward_auth: true
    rate_limit:
      average: 120
      burst: 240
    max_body_bytes: 1048576
  headlamp:
    rule: Host(`k8s.jkandler.de`)
    url: http://headlamp:80
    forward_auth: true
    rate_limit:
      average: 120
      burst: 240
    max_body_bytes: 1048576
  home:
    rule: Host(`home.jkandler.de`)
    url: http://landing-page-svc:80
    forward_auth: true
    rate_limit:
      average: 10
      burst: 5
    max_body_bytes: 16384
  # No body-size limit (attachments); Bulwark calls Stalwart's JMAP from the browser, so Stalwart needs CORS for this origin.
  mail:
    rule: Host(`mail.jkandler.de`)
    url: http://bulwark-svc:80
    forward_auth: true
    rate_limit:
      average: 120
      burst: 240
  # No forward-auth (reviewed exception, ADR 0033): sync clients, WebDAV and the apps sign in with app passwords and
  # can't follow a login redirect; the web login itself goes only through Authelia (user_oidc, force-SSO). No body
  # limit: Traefik's buffering middleware would hold each upload in memory, and the clients send chunks of up to
  # 1 GB. Nextcloud frames its own pages (PDF viewer) and sends X-Frame-Options SAMEORIGIN itself.
  nextcloud:
    rule: Host(`nextcloud.jkandler.de`)
    url: http://nextcloud-svc:80
    forward_auth: false
    rate_limit:
      average: 6000
      burst: 3000
    referrer_policy: no-referrer
    frame_deny: false
  # notify_push (in Nextcloud's Pod) expects the paths without /push; clients authenticate to it like to Nextcloud.
  nextcloud-push:
    rule: Host(`nextcloud.jkandler.de`) && PathPrefix(`/push`)
    priority: 100
    url: http://nextcloud-svc:7867
    forward_auth: false
    strip_prefix: /push
    rate_limit:
      average: 600
      burst: 1200
  # Euro-Office's editor (ADR 0034), loaded by the browser inside Nextcloud: behind forward-auth, so only browsers with an
  # Authelia session reach it; Nextcloud calls it in-cluster. It frames into Nextcloud's page (same origin). No body limit:
  # the editor talks over a websocket, which Traefik's buffering middleware breaks (its nginx caps bodies at 100m itself).
  nextcloud-eurooffice:
    rule: Host(`nextcloud.jkandler.de`) && PathPrefix(`/eurooffice`)
    priority: 100
    url: http://eurooffice-svc:8888
    forward_auth: true
    strip_prefix: /eurooffice
    rate_limit:
      average: 1200
      burst: 2400
    frame_deny: false
  stalwart:
    rule: Host(`stalwart.jkandler.de`)
    priority: 10
    url: http://stalwart-internal:8080
    forward_auth: true
    rate_limit:
      average: 120
      burst: 240
  # Protocol endpoints skip Authelia: clients can't follow a login redirect, and Stalwart authenticates each.
  stalwart-api:
    rule: Host(`stalwart.jkandler.de`) && (PathPrefix(`/jmap`) || PathPrefix(`/.well-known`) || PathPrefix(`/dav`) || PathPrefix(`/auth`) || PathPrefix(`/mail/config-v1.1.xml`) || PathPrefix(`/autodiscover`))
    priority: 100
    url: http://stalwart-internal:8080
    forward_auth: false
    rate_limit:
      average: 600
      burst: 1200
  # Web vault behind Authelia; /admin is left unrouted.
  vaultwarden:
    rule: Host(`vault.jkandler.de`) && !PathPrefix(`/admin`)
    priority: 10
    url: http://vaultwarden-svc:80
    forward_auth: true
    rate_limit:
      average: 120
      burst: 240
    max_body_bytes: 20971520
  # The apps can't pass forward-auth, so the API is public (ADR 0028); true only while creating an account, with SSO_SIGNUPS_ALLOWED in argocd/vaultwarden.
  vaultwarden-api:
    rule: Host(`vault.jkandler.de`) && (PathPrefix(`/api/`) || PathPrefix(`/identity/`) || PathPrefix(`/notifications/hub`))
    priority: 20
    url: http://vaultwarden-svc:80
    forward_auth: false
    rate_limit:
      average: 120
      burst: 240
    max_body_bytes: 20971520
