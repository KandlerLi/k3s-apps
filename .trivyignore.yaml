misconfigurations:
  - id: DS-0026
    paths:
      - containers/sankey-export/Dockerfile
    statement: >-
      HEALTHCHECK has no meaning for a run-once CronJob image; trivy has no
      inline ignore for a check triggered by a missing instruction.
  - id: KSV-0011
    statement: Requests only, no CPU limits, like every workload here.
  - id: KSV-0020
    statement: Workloads run as their images' own users, all below 10000.
  - id: KSV-0021
    statement: Workloads run as their images' own groups, all below 10000.
  - id: KSV-0125
    statement: Images come from Docker Hub and GHCR too, pinned by digest and scanned by security-scan.yml.
  - id: KSV-0014
    paths:
      - argocd/bulwark/deployment.yaml
      - argocd/grafana/deployment.yaml
      - argocd/open-webui/deployment.yaml
      - argocd/paperless/deployment.yaml
      - argocd/paperless/export-cronjob.yaml
      - argocd/stalwart/deployment.yaml
    statement: >-
      These ran with a writable root filesystem under Terraform too (Open
      WebUI and Paperless write outside their data dirs); read-only needs
      testing which paths each writes.
  - id: KSV-0022
    paths:
      - argocd/stalwart/deployment.yaml
    statement: Stalwart's binary needs NET_BIND_SERVICE in the bounding set for the mail ports.
  - id: KSV-0117
    paths:
      - argocd/stalwart/deployment.yaml
    statement: Stalwart listens on the mail ports 25, 465 and 993 directly.
  - id: KSV-0007
    paths:
      - argocd/vaultwarden/deployment.yaml
    statement: hostAliases pins auth.jkandler.de to Traefik in-cluster, so SSO needs no internet egress.
