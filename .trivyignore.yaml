misconfigurations:
  - id: DS-0026
    paths:
      - argocd/sankey-export/Dockerfile
    statement: >-
      HEALTHCHECK has no meaning for a run-once CronJob image; trivy has no
      inline ignore for a check triggered by a missing instruction.
  - id: KSV-0011
    statement: Requests only, no CPU limits, like every workload here.
  - id: KSV-0020
    statement: Workloads run as their images' own users, all below 10000.
  - id: KSV-0021
    statement: Workloads run as their images' own groups, all below 10000.
  - id: KSV-0125
    statement: Images come from Docker Hub and GHCR too, pinned by digest and scanned by security-scan.yml.
  - id: KSV-0014
    paths:
      - argocd/authelia/deployment.yaml
      - argocd/blocky/deployment.yaml
      - argocd/bulwark/deployment.yaml
      - argocd/eurooffice/deployment.yaml
      - argocd/grafana/deployment.yaml
      - argocd/minecraft/deployment.yaml
      - argocd/nextcloud/deployment.yaml
      - argocd/paperless/deployment.yaml
      - argocd/paperless/export-cronjob.yaml
      - argocd/stalwart/deployment.yaml
    statement: >-
      These ran with a writable root filesystem under Terraform too
      (Paperless writes outside its data dirs); read-only needs
      testing which paths each writes. Nextcloud's entrypoint writes
      outside its volumes too (Apache run and lock dirs, PHP in /tmp), and
      Euro-Office's entrypoints rewrite their nginx and runtime config.
      The itzg Minecraft and mc-backup images write tooling state outside /data.
  - id: KSV-0022
    paths:
      - argocd/stalwart/deployment.yaml
      - argocd/blocky/deployment.yaml
      - argocd/ingress/templates/deployment.yaml
    statement: Stalwart (25, 465, 993), Blocky (53) and Traefik (80, 443) need NET_BIND_SERVICE for their ports.
  - id: KSV-0117
    paths:
      - argocd/stalwart/deployment.yaml
      - argocd/blocky/deployment.yaml
      - argocd/ingress/templates/deployment.yaml
      - argocd/nextcloud/deployment.yaml
    statement: >-
      Stalwart, Blocky and Traefik listen on their well-known ports directly;
      Nextcloud's Apache on 80 as uid 33 through the namespaced sysctl
      net.ipv4.ip_unprivileged_port_start, without NET_BIND_SERVICE.
  - id: KSV-0007
    paths:
      - argocd/eurooffice/deployment.yaml
      - argocd/vaultwarden/deployment.yaml
    statement: >-
      hostAliases pins a public name to Traefik's ClusterIP in-cluster
      (Vaultwarden: auth.jkandler.de for SSO; Euro-Office: nextcloud.jkandler.de
      for documents and callbacks), so neither needs internet egress.
  - id: KSV-01010
    paths:
      - argocd/ingress/templates/configmaps.yaml
    statement: >-
      False positive: Traefik's config holds no secret, only the header name
      permissionsPolicy and the public ACME contact email.

# Fixed upstream, not yet in an image we can pin, checked unreachable (tracker #62). IDs match every image, hence the expiry.
vulnerabilities:
  - id: CVE-2026-111497
    expired_at: 2026-12-31
    statement: >-
      Brotli decoder in nginx-unprivileged and stalwart: no nginx process
      maps libbrotli, and the stalwart binary doesn't link it (only libcurl
      depends on it).
  - id: CVE-2025-68121
    expired_at: 2026-12-31
    statement: >-
      Go crypto/tls in the gosu of postgres:17-alpine and postgres:18-alpine,
      which only drops privileges at container start and does no TLS.
