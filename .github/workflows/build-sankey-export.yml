name: Build sankey-export image

# Builds sankey_export's image on the self-hosted runner and pushes it to GHCR.

on:
  push:
    branches:
      - main
    paths:
      - containers/sankey-export/**
      - .github/workflows/build-sankey-export.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build and push
    runs-on: [self-hosted, home, debian]
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Log in to GHCR
        run: >-
          echo "${{ secrets.GITHUB_TOKEN }}"
          | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build sankey-export image
        run: >-
          docker build
          -t ghcr.io/kandlerli/sankey-export:${{ github.sha }}
          -t ghcr.io/kandlerli/sankey-export:main
          containers/sankey-export

      # :main is what Renovate follows to propose the new digest in terraform.tfvars.
      - name: Push sankey-export image
        run: |
          docker push ghcr.io/kandlerli/sankey-export:${{ github.sha }}
          docker push ghcr.io/kandlerli/sankey-export:main

      # The immutable digest is what terraform.tfvars pins.
      - name: Print pushed image digest
        run: >-
          docker inspect
          --format='{{index .RepoDigests 0}}'
          ghcr.io/kandlerli/sankey-export:${{ github.sha }}
