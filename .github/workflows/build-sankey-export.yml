name: Build sankey-export image

# Builds sankey_export's image on a GitHub-hosted runner and pushes it to GHCR.

on:
  push:
    branches:
      - main
    # Source files only: argocd/sankey-export/** would rebuild on Renovate's digest bump in cronjob.yaml, in a loop.
    paths:
      - argocd/sankey-export/Dockerfile
      - argocd/sankey-export/*.py
      - argocd/sankey-export/requirements.txt
      - .github/workflows/build-sankey-export.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build and push
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        run: >-
          echo "${{ secrets.GITHUB_TOKEN }}"
          | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build sankey-export image
        run: >-
          docker build
          -t ghcr.io/kandlerli/sankey-export:${{ github.sha }}
          -t ghcr.io/kandlerli/sankey-export:main
          argocd/sankey-export

      # :main is what Renovate follows to propose the new digest in argocd/sankey-export/cronjob.yaml.
      - name: Push sankey-export image
        run: |
          docker push ghcr.io/kandlerli/sankey-export:${{ github.sha }}
          docker push ghcr.io/kandlerli/sankey-export:main

      # The immutable digest is what argocd/sankey-export/cronjob.yaml pins.
      - name: Print pushed image digest
        run: >-
          docker inspect
          --format='{{index .RepoDigests 0}}'
          ghcr.io/kandlerli/sankey-export:${{ github.sha }}
