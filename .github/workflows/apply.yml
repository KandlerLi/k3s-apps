name: Apply

# See checks.yml's own header comment for why there's no container:
# key here either, and why this still needs AWS OIDC credentials
# despite managing zero real AWS resources (this root's own Terraform
# state, not any resource this root creates).

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: k3s-apps-terraform
  cancel-in-progress: false

jobs:
  apply:
    name: Plan and apply
    runs-on: [self-hosted, home, debian]
    timeout-minutes: 20
    environment: production
    env:
      AWS_REGION: eu-central-1
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_in_cluster: "true"
      # No more TF_VAR_<secret> lines -- secrets.tf reads them directly
      # from AWS Secrets Manager now (the SOPS-to-Secrets-Manager
      # cutover, PARKED.md), via the same AWS credentials this job
      # already assumes below for state access. The one remaining
      # GitHub Actions secrets this repo declares
      # (github/repo-infra's own config.yml) are gone for these; only
      # non-secret repository variables (AWS_ACCOUNT_ID/AWS_ROLE_ARN
      # below) are left.

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.0"

      - name: Verify deployment configuration
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
        run: |
          if [ -z "$AWS_ACCOUNT_ID" ]; then
            echo "::error::Missing repository variable AWS_ACCOUNT_ID"
            exit 1
          fi
          if [ -z "$AWS_ROLE_ARN" ]; then
            echo "::error::Missing repository variable AWS_ROLE_ARN"
            exit 1
          fi

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-${{ github.run_id }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          # See checks.yml's own identical setting for why.
          action-timeout-s: "90"

      - name: Initialize Terraform
        run: terraform init -input=false

      - name: Run checks
        run: |
          terraform fmt -check -recursive
          terraform validate

      - name: Create saved plan
        run: terraform plan -input=false -out=tfplan

      - name: Apply saved plan
        run: terraform apply -input=false -auto-approve tfplan
