name: Security scan

# trivy config IaC misconfiguration scan -- first step of the
# workspace-level security audit (PARKED.md). Its own workflow, separate
# from checks.yml/apply.yml, so a finding on the push trigger below can
# never block an apply (apply.yml has no needs: on this job either way).
# See gha-common's own README.md for the reusable workflow's full
# details.
#
# pull_request added 2026-09-14 so this can become a required status
# check (blocking PR merges on any finding, via
# required_status_check_contexts in repo-infra's own config.yml) --
# this repo is confirmed clean (0 findings) already (k3s-apps#52 fixed
# containers/sankey-export/Dockerfile's own findings), so unlike the
# original dyndns/terraform-state rollout there's no open-findings
# window to wait out here.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  trivy-config:
    uses: KandlerLi/gha-common/.github/workflows/trivy-config.yml@v0.0.9
    # Moved to a GitHub-hosted runner 2026-09-15 -- neither scan needs AWS
    # credentials or in-cluster access, only outbound internet, so there's
    # no reason to keep contending with apply.yml's terraform job for this
    # repo's single self-hosted runner replica (PARKED.md's "Trivy scan
    # and terraform apply serialize on the same self-hosted runner").
    with:
      runs_on: '["ubuntu-latest"]'
    permissions:
      contents: read

  # trivy image CVE scan -- second step of the same audit. Deliberately
  # informational only (see trivy-image.yml's own header comment), so
  # this is never added to required_status_check_contexts the way
  # trivy-config above is. One matrix entry per pinned image this repo's
  # Terraform deploys (modules/*/main.tf) -- kept in sync by hand, same
  # as every other digest reference in this repo (see e.g. sankey-export's
  # own image bump PRs): there's no automated extraction from the .tf
  # files, so a digest bump here needs a matching edit in this matrix, or
  # the scan silently drifts to scanning a stale image.
  #
  # home_agent_image is deliberately NOT in this matrix, unlike
  # sankey_export_image -- found live 2026-09-15: a repo-scoped
  # GITHUB_TOKEN only gets implicit read access to packages *that same
  # repo* published (which is exactly why the live cluster's own
  # image pull uses a dedicated long-lived PAT,
  # k3s_apps_ghcr_pull_token, not GITHUB_TOKEN, for this one). home-agent
  # is built by home-infra, not this repo, so trivy-image.yml's GHCR
  # login here can't actually read it (GHCR returns MANIFEST_UNKNOWN,
  # not an auth error, for a private package the caller can't see --
  # looked like the image didn't exist at first). Scanned from
  # home-infra's own security-scan.yml instead, where it does.
  trivy-image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: authelia
            ref: ghcr.io/authelia/authelia:4.39.22@sha256:936134132eaf01bfa2faf85055afbc1e0cc1cc5ca4547e9c06408fd0dd784646
          - name: blocky
            ref: ghcr.io/0xerr0r/blocky:v0.34.0@sha256:595136fb127f4c952b621113e668c09acdcf15ac054d96ee6d4c51a76c35f5fd
          - name: blocky-postgres
            ref: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
          - name: alertmanager
            ref: prom/alertmanager:v0.34.0@sha256:690c7b525f4367aa91f73e2f91c632206d32e97c6384bdbf2fb7a861b420340d
          - name: deluge
            ref: linuxserver/deluge:2.2.0-ls381@sha256:33a939576f7ecfc1227db1a0cb2afce030ce983e620ec9d93c956e3700e21fe9
          - name: landing-page
            ref: nginxinc/nginx-unprivileged:1.27-alpine@sha256:65e3e85dbaed8ba248841d9d58a899b6197106c23cb0ff1a132b7bfe0547e4c0
          - name: traefik
            ref: traefik:v3.7.1@sha256:6b9cbca6fac42ab0075f5437d8dc1685cfd188626d8d515839ea94f8b6271c42
          - name: open-webui
            ref: ghcr.io/open-webui/open-webui:v0.11.0-slim@sha256:88da9f0e08b8ada8e40bc6d6291494e2c6775a62d24b67b0cefb74ffee4ce621
          - name: grafana
            ref: grafana/grafana:13.1.4@sha256:9be3a3ccdb06bcbb127f888b0c4c1d151837443e478887897a63a27d7b348043
          - name: k8s-dashboard
            ref: kubernetesui/dashboard:v2.7.0@sha256:2e500d29e9d5f4a086b908eb8dfe7ecac57d2ab09d65b24f588b1d449841ef93
          - name: sankey-export
            ref: ghcr.io/kandlerli/sankey-export@sha256:bb43a6ee10d568affd3cbd1388af05a4bfe4274cd0880f3827fb2cb7f755e806
          - name: paperless
            ref: ghcr.io/paperless-ngx/paperless-ngx:3.2.1@sha256:5fa76604a81df6945086e0837b14b56543d137e8ce4f311cc5d9ebe907e74e79
          # home_agent's own sidecar container -- the one image in this
          # repo NOT pinned by digest (modules/home_agent/main.tf), so
          # this entry alone will drift to whatever :3.13-slim-bookworm
          # resolves to on the day the scan runs, unlike every other row.
          - name: home-agent-nextcloud-tools-sidecar
            ref: python:3.13-slim-bookworm
    uses: KandlerLi/gha-common/.github/workflows/trivy-image.yml@v0.0.10
    with:
      image_name: ${{ matrix.name }}
      image_ref: ${{ matrix.ref }}
      # Same reasoning as trivy-config above -- GitHub-hosted, not this
      # repo's single self-hosted runner replica.
      runs_on: '["ubuntu-latest"]'
    permissions:
      contents: read
      packages: read

  gitleaks:
    uses: KandlerLi/gha-common/.github/workflows/gitleaks.yml@v0.0.12
    permissions:
      contents: read
