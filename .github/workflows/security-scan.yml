name: Security scan

# Separate from checks.yml/apply.yml so a finding can never block an apply.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # Weekly: new CVEs in unchanged images, see trivy-image below.
  schedule:
    - cron: "23 5 * * 1"

jobs:
  trivy-config:
    uses: KandlerLi/gha-common/.github/workflows/trivy-config.yml@v0.0.9
    # Needs no AWS or cluster access, so it stays off the self-hosted runner.
    with:
      runs_on: '["ubuntu-latest"]'
    permissions:
      contents: read

  # Every image ref in the Terraform code; home-agent is private to home-infra and scanned there.
  discover-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.find.outputs.matrix }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: find
        run: |
          {
            grep -rhoE '[a-z0-9.-]+(/[a-z0-9._-]+)*(:[A-Za-z0-9._-]+)?@sha256:[0-9a-f]{64}' --include='*.tf' --include='*.tfvars' .
            grep -rhoE '^\s*image\s*=\s*"[^"@$]+:[^"@]+"' --include='*.tf' . | sed -E 's/.*"(.*)"/\1/'
          } | grep -v '^ghcr.io/kandlerli/home-agent[:@]' | sort -u \
            | jq -Rnc '[inputs | {name: (split("@")[0] | split("/")[-1]), ref: .}]' > matrix.json
          echo "matrix=$(cat matrix.json)" >> "$GITHUB_OUTPUT"

  # Informational on PR/push; the weekly run fails on fixable CRITICALs, which GitHub emails about.
  trivy-image:
    needs: discover-images
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover-images.outputs.matrix) }}
    uses: KandlerLi/gha-common/.github/workflows/trivy-image.yml@v0.0.15
    with:
      image_name: ${{ matrix.name }}
      image_ref: ${{ matrix.ref }}
      fail_on_severity: ${{ github.event_name == 'schedule' && 'CRITICAL' || '' }}
      # GitHub-hosted, like trivy-config above.
      runs_on: '["ubuntu-latest"]'
    permissions:
      contents: read
      packages: read

  gitleaks:
    uses: KandlerLi/gha-common/.github/workflows/gitleaks.yml@v0.0.12
    permissions:
      contents: read
