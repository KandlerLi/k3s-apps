name: Checks

# Static checks only: this repo has no Terraform; Argo CD deploys argocd/ (README, "CI").

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Renders every app the way Argo CD does, so a broken manifest fails here instead of in a sync.
      - name: Render every Argo CD app
        run: |
          status=0
          for dir in argocd/*/; do
            app="$(basename "$dir")"
            if [ -f "$dir/Chart.yaml" ]; then
              helm template "$app" "$dir" --namespace apps > /dev/null || { echo "::error file=${dir}Chart.yaml::helm template failed"; status=1; }
            elif [ -f "$dir/kustomization.yaml" ]; then
              kubectl kustomize "$dir" > /dev/null || { echo "::error file=${dir}kustomization.yaml::kustomize build failed"; status=1; }
            else
              echo "::error::$dir has neither Chart.yaml nor kustomization.yaml"; status=1
            fi
          done
          exit "$status"

      # A hand edit to a generated dashboard would be overwritten by the next generator run.
      - name: Grafana dashboards match their generator and pass static checks
        run: |
          tmp="$(mktemp -d)"
          cp -r argocd/grafana/dashboards/. "$tmp"
          python3 scripts/grafana-dashboards.py "$tmp" > /dev/null
          diff -r argocd/grafana/dashboards "$tmp" || { echo "::error::rerun scripts/grafana-dashboards.py and commit the result"; exit 1; }
          python3 scripts/check-grafana-dashboards.py

