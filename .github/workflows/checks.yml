name: Checks

# No container: key, unlike every AWS-family repo's own checks.yml/
# apply.yml -- this repo needs no Docker image at all, and running
# steps directly on the runner's own host (not inside a nested
# docker:dind container) means they share the runner Pod's own
# filesystem namespace, so they automatically see the k3s-apps-ci
# ServiceAccount token Kubernetes mounts into the Pod -- no volume-mount
# plumbing needed to get it into a job-specific container the way AWS
# repos need for other things. See the separate k3s-bootstrap repo's
# own main.tf and modules/github_runner comments for the ServiceAccount
# itself and how it's wired onto this repo's own runner Deployment.
#
# Still needs AWS OIDC credentials, though -- found live (2026-09-03):
# this root's own Terraform *state* lives in S3 (see versions.tf), an
# entirely separate concern from the in-cluster ServiceAccount, which
# only covers the kubernetes provider's own actions. repo-infra's own
# aws_policies.tf has a k3s-apps entry scoped to exactly its state key,
# nothing more -- this repo manages zero real AWS resources.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: [self-hosted, home, debian]
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.0"

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialize without the remote backend
        run: terraform init -backend=false -input=false

      - name: Validate Terraform
        run: terraform validate

  plan:
    name: Terraform plan
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: validate
    runs-on: [self-hosted, home, debian]
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: eu-central-1
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      # Selects the in-cluster auth branch in provider.tf -- see that
      # file's own comment for the two modes and why this is safe.
      TF_VAR_in_cluster: "true"
      TF_VAR_deluge_web_password: ${{ secrets.DELUGE_WEB_PASSWORD }}
      TF_VAR_home_agent_ghcr_token: ${{ secrets.HOME_AGENT_GHCR_TOKEN }}
      TF_VAR_home_agent_openai_api_key: ${{ secrets.HOME_AGENT_OPENAI_API_KEY }}
      TF_VAR_nextcloud_tools_app_password: ${{ secrets.NEXTCLOUD_TOOLS_APP_PASSWORD }}
      TF_VAR_grafana_admin_password: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
      TF_VAR_blocky_postgres_password: ${{ secrets.BLOCKY_POSTGRES_PASSWORD }}
      TF_VAR_alertmanager_ses_smtp_username: ${{ secrets.ALERTMANAGER_SES_SMTP_USERNAME }}
      TF_VAR_alertmanager_ses_smtp_password: ${{ secrets.ALERTMANAGER_SES_SMTP_PASSWORD }}
      TF_VAR_shared_ingress_auth_password_hash: ${{ secrets.SHARED_INGRESS_AUTH_PASSWORD_HASH }}
      TF_VAR_k3s_ingress_acme_dns01_access_key_id: ${{ secrets.K3S_INGRESS_ACME_DNS01_ACCESS_KEY_ID }}
      TF_VAR_k3s_ingress_acme_dns01_secret_access_key: ${{ secrets.K3S_INGRESS_ACME_DNS01_SECRET_ACCESS_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.0"

      - name: Verify plan configuration
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_PLAN_ROLE_ARN: ${{ vars.AWS_PLAN_ROLE_ARN }}
        run: |
          if [ -z "$AWS_ACCOUNT_ID" ]; then
            echo "::error::Missing repository variable AWS_ACCOUNT_ID"
            exit 1
          fi
          if [ -z "$AWS_PLAN_ROLE_ARN" ]; then
            echo "::error::Missing repository variable AWS_PLAN_ROLE_ARN"
            exit 1
          fi

      - name: Configure read-only AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          role-session-name: GitHubPlan-${{ github.run_id }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          # See gha-common's own terraform-checks.yml for the original,
          # confirmed-live OIDC connection hang this guards against --
          # that one was root-caused to dind's own *inner* bridge
          # network defaulting to MTU 1500, which doesn't apply here
          # (no container: job, no nested dind at all, so this
          # container already sees the Pod's real MTU-1450 overlay
          # directly). Kept anyway as a cheap, general escape hatch --
          # the action's own maintainers added it for self-hosted-
          # runner OIDC hangs broadly, not only that one specific
          # cause, and an untriggered timeout costs nothing.
          action-timeout-s: "90"

      - name: Initialize Terraform
        run: terraform init -input=false

      - name: Create speculative plan
        run: terraform plan -input=false -lock=false -no-color
